backend:
  image:
    # Published by .github/workflows/ci.yml's `publish` job on every push
    # to main (docs/adr/0010-image-publishing-and-versioning.md), tagged
    # `X.Y.Z` — no `v`, since docker/metadata-action's {{version}} strips
    # it — plus `X.Y`, `X`, `sha-<commit>` and a rolling `latest`.
    #
    # Blank means the chart's own `appVersion`, which is a real release.
    # DO NOT set this to `latest`: with `pullPolicy: IfNotPresent` a node
    # that already holds a `latest` layer never re-pulls it, so the cluster
    # silently keeps the first build it ever saw — across pod deletes and
    # across releases. Upgrading is a bump of `appVersion` (or of this),
    # which is a change GitOps can see, diff and roll back.
    repository: ghcr.io/team-redbull/server-scan-api
    tag: ""
    # Correct BECAUSE the tag is immutable: an image already on the node is
    # the same image. `Always` only makes sense with a floating tag, which
    # is what the line above exists to avoid.
    pullPolicy: IfNotPresent
  # 3, not the 2 this shipped with since the first scaffold commit with
  # no comment justifying it: 2 is only the floor for a zero-downtime
  # rolling update (one replica keeps serving while the other updates).
  # A 3rd buys tolerance for a node failure *during* a rollout without
  # briefly dropping to zero capacity. There is still no
  # PodDisruptionBudget or HorizontalPodAutoscaler in this chart, so this
  # is a static floor, not an autoscaled one.
  replicaCount: 3
  port: 8080
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
  # Signs opaque keyset-pagination cursors (see docs/adr/0006 and
  # `app.domain.services.cursor`). Blank here means the API falls back to
  # its own committed dev-insecure default — fine for local/dev, and
  # `Settings` itself refuses to start with that default once
  # `INVENTORY_ENVIRONMENT=production` (see backend-configmap.yaml). Set a
  # real, deployment-specific value with `--set backend.cursorSecret=...`
  # or a `-f secrets.yaml` not in git — same pattern as
  # `auth.existingSecret` below — or point `existingCursorSecret` at
  # a Secret (key `cursor-secret`) managed elsewhere (Vault, External
  # Secrets, sealed-secrets) to skip this chart's own Secret entirely.
  cursorSecret: ""
  existingCursorSecret: ""

# "Run job" in the UI (docs/adr/0055): admins start a collector or prune
# CronJob like `kubectl create job --from=cronjob/<name>` and read its pods' logs. On by
# default (an absent key counts as on, so the platform repo's values.yaml gets it too; set
# `enabled: false` to remove it). On gives the API pod a ServiceAccount, mounts its token, and binds a Role in THIS
# namespace only: cronjobs get/list, jobs get/list/create, pods get/list, pods/log get. Only
# CronJobs labelled `server-scan.io/triggerable: "true"` in this namespace can be run: this
# chart's two prunes and the `server-scan-collectors` hub release's collectors (its
# `triggerable`). The endpoints are admin only. The `nodes-status` chart's jobs never are.
jobTrigger:
  enabled: true

# The MCP server for Claude Code (ADR-0054): `python -m tools.mcp_server --http` from the API image,
# reached at /mcp on the frontend's host (so it needs `frontend.enabled`). Off by default; it holds
# no credentials and calls the API with each caller's own token.
mcp:
  enabled: false
  replicaCount: 2
  port: 8090

# The React admin UI (the `server-scan-frontend` image CI publishes
# alongside the API). Off by default so an existing install is unchanged;
# turning it on requires `route.host`, because the SPA and the API then
# share one host, served by the frontend's own nginx proxy — see route below.
frontend:
  enabled: false
  image:
    # Same rules as backend.image above — blank means `appVersion`.
    repository: ghcr.io/team-redbull/server-scan-frontend
    tag: ""
    pullPolicy: IfNotPresent
  # Same reasoning as backend.replicaCount above.
  replicaCount: 3
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi

# Where the connection strings come from when a database is NOT bundled
# below. Two ways to get them there, picked per release:
#
# - Set mongoUri / redisUri here and this chart renders the db.secretName
#   Secret itself (templates/db-secret.yaml) — nothing to create by hand.
#   Plaintext in this values file, so it's the right choice only where the
#   values file's own storage is already trusted for secrets (e.g. a
#   private, air-gapped Git repo), not a public or shared one.
# - Leave them blank and pre-provision a Secret named secretName yourself
#   (a secrets operator, or `oc create secret`) with keys `mongo-uri` /
#   `redis-uri` — this chart only consumes it, as before.
#
# Each database is resolved independently, so bundling one and pointing at
# an operated instance for the other is a supported combination — only the
# key for the non-bundled half is read from here, and mongoUri/redisUri are
# ignored for whichever half is bundled (mongodb.enabled/redis.enabled
# below always win for that half).
db:
  secretName: server-scan-db
  mongoUri: ""
  redisUri: ""
  # The database INVENTORY_MONGO_URI's connection is used against — read
  # explicitly by name (`app.infrastructure.mongodb.client`), never taken
  # from the URI's own path segment, so this is the one value that
  # actually selects it. Must match whatever database name your MongoDB
  # instance actually has for this app; the nodes-status chart's db.dbName
  # must be set to the same value, since both write into it.
  dbName: server-scan

# --- Bundled databases (both OFF by default) -------------------------------
#
# For an estate with no operated MongoDB/Redis of its own. Each is a Bitnami
# subchart gated by its own `enabled`, so all four combinations render:
# neither, MongoDB only, Redis only, both. Everything under `mongodb:` and
# `redis:` other than `enabled` is that subchart's own values — see its docs
# for anything not set here.
#
# Air-gapped installs need the dependencies vendored: run
# `helm dependency update deploy/helm/server-scan` on a connected
# machine and commit the resulting charts/*.tgz.
mongodb:
  # MongoDB is the system of record. Bundling it means this chart owns the
  # lifecycle of the platform's only durable state — backup, replication and
  # upgrades included. Fine for a demo, a lab or a small site; a production
  # estate should still point `db.secretName` at an operated service.
  enabled: false

  # Bitnami's chart defaults its image to `bitnami/mongodb:latest`, which is
  # not a version and, since Bitnami's August 2025 catalog change, is a
  # development build. Version tags for the free catalog live under
  # `bitnamilegacy/*`, frozen at August 2025. Pin one explicitly for
  # anything that has to be reproducible or mirrored into an air-gapped
  # registry — the chart version above pins the templates, not the image.
  #
  # A real version gap, confirmed 2026-09-08 by reading this vendored
  # chart's own Chart.yaml: chart 19.1.16 (above) was built against
  # MongoDB 8.3.4, which the frozen legacy catalog does not carry —
  # `bitnamilegacy/mongodb` tops out at 8.0.13. There is no exact match
  # available; 8.0.13 is the newest the free catalog has and is offered
  # here as the practical choice, not a confirmed-compatible one — smoke
  # test before trusting it in production.
  # image:
  #   repository: bitnamilegacy/mongodb
  #   tag: 8.0.13-debian-12-r0

  # Fixed, because the connection string is built from it
  # (templates/bundled-db-secret.yaml).
  fullnameOverride: server-scan-mongodb
  architecture: standalone

  # Strips runAsUser/fsGroup so the pod runs under the UID OpenShift's
  # restricted-v2 SCC assigns it.
  global:
    compatibility:
      openshift:
        adaptSecurityContext: auto

  auth:
    enabled: true
    rootUser: root

    # A Secret managed outside this chart, holding `mongodb-root-password`
    # and `mongodb-passwords` (the subchart's own key names). Setting it is
    # the production path, and it changes where the CONNECTION STRING comes
    # from too: the chart never sees the password, so it cannot compose a
    # URI around it. That Secret must therefore also carry `mongo-uri`, and
    # `db.secretName` must name it. One Secret, both keys — created by a
    # secrets operator, or by hand:
    #
    #   oc create secret generic server-scan-db \
    #     --from-literal=mongodb-root-password=... \
    #     --from-literal=mongodb-passwords=... \
    #     --from-literal=mongo-uri='mongodb://server-scan:...@server-scan-mongodb:27017/server-scan?authSource=server-scan'
    #
    # Leave it empty and the two passwords below are used instead, and the
    # chart composes the URI itself.
    existingSecret: ""

    # SET THESE unless `existingSecret` above is set. A blank password makes
    # the subchart generate one, and `helm template` — how Argo CD renders
    # this chart — has no `lookup`, so a generated password is re-minted on
    # every sync and every pod ends up holding a credential the database no
    # longer has. Keep them alphanumeric: they go into a URI unescaped, and
    # DO NOT commit them — that is what `existingSecret` is for.
    rootPassword: ""
    usernames: ["server-scan"]
    passwords: [""]
    # Must match INVENTORY_MONGO_DB, whose default is `server-scan`.
    databases: ["server-scan"]

  persistence:
    enabled: true
    size: 20Gi
    # Empty uses the cluster's default StorageClass.
    storageClass: ""

  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { memory: 2Gi }

redis:
  # Cache-aside only — every read path degrades to MongoDB on a miss or an
  # outage (`app.infrastructure.redis`), so this is a latency choice, never a
  # correctness one, and persistence is off for the same reason.
  enabled: false

  # Same `:latest` trap as MongoDB above — see there. Same version gap
  # too: chart 28.0.15 (above) was built against Redis 8.10.1, which the
  # frozen legacy catalog does not carry — `bitnamilegacy/redis` tops out
  # at 8.2.1. Offered as the practical choice, not a confirmed-compatible
  # one.
  # image:
  #   repository: bitnamilegacy/redis
  #   tag: 8.2.1-debian-12-r0

  fullnameOverride: server-scan-redis
  architecture: standalone

  global:
    compatibility:
      openshift:
        adaptSecurityContext: auto

  auth:
    enabled: true

    # Same escape hatch, same consequence as MongoDB's above: set this and
    # the Secret must also carry `redis-uri`, with `db.secretName` naming it.
    # `existingSecretPasswordKey` is the key inside it holding the password —
    # the subchart has no default for it.
    existingSecret: ""
    existingSecretPasswordKey: ""

    # SET THIS unless `existingSecret` is, for the same generated-password
    # reason as MongoDB above. Do not commit it.
    password: ""

  master:
    persistence:
      enabled: false
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { memory: 512Mi }

config:
  # The sites this deployment has, as `code:Display Name` pairs. The code
  # is the token that appears inside a hostname (`ocp4-prod-tlv-infra-01`
  # -> `tlv`), so it must be lowercase letters, digits and single hyphens.
  # It may itself be `|`-separated aliases (`znif|prep:Znif`) when more
  # than one naming convention names the same site — the first token is
  # canonical, the rest are recognised but never produced as a value.
  #
  # This is the only place sites are defined: changing this list renames or
  # adds a site across the API, the UI's site cards, the inventory filter,
  # the policy editors and the seeded classification rules at once, with no
  # code change and no image rebuild. It reaches both the API and every
  # collector, because a collector derives each server's site at ingest.
  #
  # Empty uses the shipped default
  # ("nyc:New York City,tlv:Tel Aviv,bat-yam:Bat Yam,five:Site Five").
  # A malformed entry fails the pod at startup rather than silently
  # producing a site no server can ever be assigned to.
  # See docs/adr/0018-sites-from-configuration.md.
  #
  # Set it here, or in a values file. NOT with a bare `--set`: helm reads
  # the commas as its own separators and silently splits the list into
  # several keys. From the command line it has to be
  #     --set-string 'config.sites=nyc:New York City\,tlv:Tel Aviv'
  sites: ""

  # The BMC IP names a server's site first, before the name and profile DN
  # (ADR-0057; a disagreeing name is a CRITICAL health reason): the
  # BMC IP's leading octets, as `prefix=site` pairs (a site from `sites`
  # above), e.g. "10=tlv,149=bat-yam,69=tokyo". Whole octets, longest prefix
  # wins ("10" never matches 100.x). Empty disables it. Same `--set` comma
  # gotcha as `sites`. See docs/adr/0056-site-from-bmc-ip.md.
  siteBmcPrefixes: ""

  # GPU VRAM overrides, as `PID:Friendly Name:VRAM_GB` triples. No
  # management plane reports GPU memory, so the platform ships a built-in
  # table of 30 NVIDIA and AMD datacenter cards — empty means that table
  # alone, NOT "enrich nothing". Set this only to correct a row or to add
  # a card the table does not carry; your entry wins for the identifier
  # it names and every other built-in row still applies. The first field
  # is a Cisco PID or a vendor model string (`NVIDIA A100-PCIE-40GB`);
  # both match. A malformed entry fails the collector pod at startup
  # rather than silently reporting no VRAM. Same comma-splitting gotcha
  # as `sites` above applies to `--set` on the command line. See
  # docs/adr/0021-built-in-gpu-catalog-with-model-matching.md.
  gpuModels: ""
  # A network interface's OS-level name (`ens8f0np0`) against the hardware
  # name a BMC reports (`NIC.Slot.8-1-1`), keyed on the FQDD kind and
  # ordered by port. No management API reports an OS-level name — it does
  # not exist until the host boots — so this is stated knowledge, learned
  # once by running `ip link` on a host. Empty is a real state: the UI
  # shows the hardware name alone rather than inventing one. Example:
  # "Integrated.1=eno12399np0,eno12409np1;Slot.8=ens8f0np0,ens8f1np1".
  # Same comma-splitting gotcha as `sites` above applies to `--set`.
  nicOsNames: ""
  logLevel: INFO
  metricsEnabled: "true"
  # A server not successfully collected for this long counts toward the
  # `server_scan_servers_stale` gauge (ADR-0029). Four of the shared
  # 3-hour collector cycles (two when it was 6-hourly), kept at 12h on purpose.
  staleAfterSeconds: "43200"
  defaultPageSize: "50"
  maxPageSize: "200"
  corsAllowedOrigins: ""
  # Caps `?count=` on GET /servers/available, so a caller can't
  # accidentally pay the live-recheck cost of the whole matching fleet
  # in one call. See docs/adr/0032-available-server-lookup-api.md.
  maxAvailableCount: "20"
  # `token:alias` pairs: a `?pattern=` that is exactly one configured
  # token also matches the alias regex — a `hypershift`-named server
  # carries no explicit capacity token but is a 5tb machine, and
  # `hypershift-data` a 10tb one. The negative lookahead keeps `5tb` from
  # also matching `hypershift-data`. Empty falls back to this same value
  # as the shipped default. Same comma-splitting gotcha as `sites` above
  # applies to `--set`.
  capacityAliases: "5tb:hypershift(?!-data),10tb:hypershift-data"

# Prometheus Operator objects for the API's /metrics — the HTTP metrics
# plus the fleet gauges (stale servers, collector liveness, cluster
# liveness, health mix; ADR-0029). Both are OFF by default because they
# need the monitoring.coreos.com CRDs, which vanilla Kubernetes does not
# have; on OpenShift they always exist, so turn both on there and enable
# user-workload monitoring once per cluster (deploy/README.md says how).
metrics:
  serviceMonitor:
    enabled: false
    interval: 30s
    # Extra labels, for a Prometheus whose `serviceMonitorSelector` needs
    # one. OpenShift's user-workload Prometheus needs none.
    labels: {}
  prometheusRule:
    enabled: false
    labels: {}
    # Which evaluator runs the rules. `leaf-prometheus` (default) adds the label
    # openshift.io/prometheus-rule-evaluation-scope: leaf-prometheus, so the user-workload Prometheus
    # evaluates them: alerts reach the cluster Alertmanager and recorded series are remote-written,
    # but it sees only user-namespace series, so the pod rules use `up` and
    # `process_start_time_seconds` and there are no frontend, memory or pod-state rules.
    # `thanos-ruler` emits no label: Thanos Ruler sees platform kube_* / container_* series (pod-state,
    # memory, frontend rules; kube-state-metrics must export kube_deployment_status_replicas_ready
    # and kube_deployment_spec_replicas) but needs an Alertmanager and a store wired to it, or the
    # results vanish silently. Any other value fails the render; absent means leaf-prometheus.
    evaluationScope: leaf-prometheus

    # `server_scan_servers_stale` above this per collector fires
    # ServerScanServersStale. 0 alerts on the first stale server.
    staleServersThreshold: 10
    # A collector that has not reported for this long fires
    # ServerScanCollectorSilent. Two of the shared 3-hour collector
    # cycles (`collectors.*.schedule`) — match it if you change those.
    # NOT used for the membership jobs, which run on their own, much
    # tighter schedule; see membershipSilentForSeconds below.
    silentForSeconds: 21600
    # A `nodes-status` job (`nodes`/`agents`) that has not completed a run for
    # this long fires ServerScanMembershipRunSilent; a cluster that has
    # not had a server matched for this long fires ServerScanClusterSilent.
    # Two of `deploy/helm/nodes-status`'s default 15-minute
    # `nodes.schedule`/`agents.schedule` cycles — match it if you change
    # those (ADR-0029's 2026-09-24 update; this used to share
    # silentForSeconds above, which meant 12h of silence on a job that
    # runs every 15 minutes before anything fired).
    membershipSilentForSeconds: 1800
    # ServerScanLoginDependencyFailing / ServerScanAvailableRecheckFailing fire when this fraction of
    # LDAP, AD API or vendor-recheck calls failed over 10m; ServerScanLoginSlow when POST /auth/login
    # p95 exceeds loginSlowSeconds (ADR-0042). Both fall back to these values if the key is absent.
    loginDependencyFailureRatio: 0.2
    loginSlowSeconds: 3
    # ServerScanAuditRetentionBehind (ADR-0045) fires when the oldest audit event is older than
    # collectors.auditRetention.retentionDays plus this many days. Rendered only once
    # collectors.auditRetention.reportOnly is false; falls back to 14 if the key is absent.
    auditRetentionSlackDays: 14
    # ServerScanApiRestarting (and, with evaluationScope: thanos-ruler, ServerScanFrontendRestarting)
    # fire above this many container restarts in 30m; podMemoryLimitRatio is the memory-limit fraction
    # for ServerScan*MemoryNearLimit, rendered only with evaluationScope: thanos-ruler (and the frontend
    # ones only while frontend.enabled). Both fall back to these values if the key is absent.
    podRestartsThreshold: 3
    podMemoryLimitRatio: 0.9
    # A `nodes-status` job (`nodes`/`agents`) whose last real run left this many
    # hostnames unmatched fires ServerScanMembershipUnmatched. 0 means any
    # unmatched hostname is worth investigating (ADR-0029's 2026-09-24
    # update) — raise it for an estate with a known, accepted gap.
    membershipUnmatchedThreshold: 0
  # Turns on OpenShift's user-workload monitoring by writing the
  # `cluster-monitoring-config` ConfigMap into openshift-monitoring —
  # the only thing that makes the ServiceMonitor above get scraped. OFF
  # by default for three reasons that all apply at once: it is
  # OpenShift-specific, it is a cluster-wide setting written from an
  # application chart into a namespace the chart does not otherwise
  # own, and a cluster that already has that ConfigMap (the OpenShift
  # docs tell admins to hand-write it) will collide unless it is adopted
  # first — the template says how. Turn it on when this chart is the
  # one place monitoring is meant to be configured from.
  userWorkloadMonitoring:
    enabled: false

route:
  enabled: true
  # Empty lets OpenShift generate one from the Service name.
  #
  # Exactly ONE Route is created either way: the frontend's when
  # `frontend.enabled`, the API's otherwise. With the frontend on, the
  # SPA's own nginx forwards /api/, /health/, /metrics, /docs, /redoc and
  # /openapi.json to the API Service in-cluster, so the API needs no Route
  # of its own and every one of those is reachable on the single host.
  # Exposing another path is a `location` block in
  # templates/frontend-api-proxy-configmap.yaml, never another Route.
  host: ""
  # How long the Route (HAProxy) and the frontend nginx wait for the API to answer
  # `GET /api/v1/servers/available`, whose live recheck of a vendor manager can take
  # longer than their 30 s / 60 s defaults (ADR-0032, 2026-10-11 update). Sets the
  # Route's `haproxy.router.openshift.io/timeout`, which covers every path on the
  # host, and nginx's `proxy_read_timeout` for that one path only. Keep it above the
  # slowest recheck timeout in `recheck.timeouts` (UCS Central is 240 s).
  timeoutSeconds: 300

# The API's half of `GET /servers/available`'s live recheck (ADR-0032): the
# vendor logins it rechecks with, and how long it waits on each manager. The
# collectors themselves are the separate `server-scan-collectors` chart; this
# reads that release's credentials Secret, it does not render one.
recheck:
  # The `server-scan-collectors` hub release's `<release>-collector-credentials`
  # (or whatever it names as `collectors.existingSecret`). Mounted optional:
  # until it exists every manager is unconfigured and the API trusts Mongo,
  # which is also what a KubeVirt VM always gets (the hub never rechecks one).
  credentialsSecret: server-scan-collectors-collector-credentials
  # Seconds per ManagerType, as INVENTORY_AVAILABLE_RECHECK_TIMEOUTS: keep each
  # equal to that collector's own per-call timeout (`collectors.ucsCentral.
  # timeoutSeconds`, `collectors.intersight.connectTimeoutSeconds`, ... in the
  # collectors chart), so the API waits as long as its CronJob does. A type
  # left out uses the shared 15 s default (ONEVIEW and OPENMANAGE today).
  timeouts:
    UCS_CENTRAL: 240
    INTERSIGHT: 10
  # Intersight's fleet-page read timeout, the collectors chart's
  # `collectors.intersight.readTimeoutSeconds`. Remove it for the backend default.
  # A values file with no `recheck` block at all gets these same defaults.
  intersightReadTimeoutSeconds: 60

# Shared by this chart's two CronJobs, `prune-servers` and `prune-events`.
# Every collector CronJob, its logins and its schedule live in the separate
# `server-scan-collectors` chart (deploy/helm/server-scan-collectors).
collectors:
  # IANA name, applied to every CronJob's `spec.timeZone` (Kubernetes 1.27+,
  # GA). Left blank, a CronJob runs on the cluster's own configured
  # timezone — kube-controller-manager's, almost always UTC regardless of
  # where the cluster physically sits. Setting this keeps a schedule like
  # "0 2 * * *" meaning 2am local, DST included, rather than 2am UTC.
  timeZone: "Asia/Jerusalem"

  # Applied to every CronJob's `jobTemplate.spec.ttlSecondsAfterFinished`
  # (the TTL controller, GA since Kubernetes 1.23): the finished Job object
  # (and its Pod) is deleted this many seconds after it completes, success
  # or failure, independent of `successfulJobsHistoryLimit`/
  # `failedJobsHistoryLimit` below — whichever cleanup condition is met
  # first wins. 8 hours: long enough that a run's logs/status are still
  # there to check shortly after it finished. Set to 0 to disable and rely
  # on the count limits alone.
  jobTtlSeconds: 28800

  # Deletes servers no manager has listed for `afterSeconds` (docs/adr/0037).
  # Off by default. Even when enabled it only REPORTS until `apply` is true,
  # so the first rollout shows what it would delete in the job logs.
  prune:
    enabled: false
    apply: false
    suspend: false
    # 03:00, 09:00, 15:00, 21:00: three hours after every other 3-hourly
    # collector sweep, so every manager's last run is recent when the guard checks it.
    schedule: "0 3,9,15,21 * * *"
    afterSeconds: 86400
    # Most of one collector's servers a single pass may delete.
    maxFraction: 0.2
    # A manager whose last run is older than this blocks its own pruning.
    maxRunAgeSeconds: 21600
    backoffLimit: 0
    activeDeadlineSeconds: 600
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi

  # Audit-event retention (tools/prune_events.py, ADR-0045). Weekly. REPORT-ONLY until
  # reportOnly is false: the job logs `audit_retention.report_only` with the count it would
  # delete and deletes nothing. retentionDays 0 keeps every event forever; otherwise >= 7.
  # Every event older than the window goes, of any type (SERVER_PRUNED included).
  auditRetention:
    enabled: true
    reportOnly: true
    retentionDays: 180
    batchSize: 5000
    maxBatches: 200
    suspend: false
    schedule: "30 3 * * 0"
    backoffLimit: 0
    activeDeadlineSeconds: 1800
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi

# AD login (docs/adr/0034): every request is open (auth.enabled: false,
# the default) until this points at a real AD/LDAP + the operator's own
# "AD API" REST service. There is no AD reachable from this chart's own
# CI/dev use, so off is what every existing install keeps getting.
#
# DO NOT COMMIT REAL VALUES HERE. Pass them at install time
# (`--set auth.adApi.clientId=...`), from a values file kept out of git,
# or set `existingSecret` below and let a secrets operator own the Secret
# — same pattern as `backend.existingCursorSecret` above.
auth:
  enabled: false

  ldap:
    server: ""
    port: 389
    domain: ""
    # Plain LDAP (the default) sends the bind password in cleartext —
    # set only against a server that terminates LDAPS on this port.
    useSsl: false

  adApi:
    url: ""
    clientId: ""
    # A PEM CA bundle path, for an internal AD API behind a private CA.
    # Blank verifies against the pod's system trust store.
    caBundle: ""
    # Set false to skip TLS certificate verification entirely against the
    # AD API (a self-signed/untrusted cert with no CA bundle available).
    # Insecure — prefer caBundle above whenever the CA can be obtained.
    verifyTls: true

  # Comma-separated `sAMAccountName`s, matched case-insensitively. Admin is
  # checked before viewer, and a user's own list before its group list, so
  # a listed user costs no AD API call. Same `--set` comma-splitting
  # gotcha as `config.sites` above — use a values file or `--set-string`.
  adminGroups: ""
  viewGroups: ""
  adminUsers: ""
  viewerUsers: ""
  # Read-only plus the audit trail (Events, a server's History); checked after admin and before
  # view (docs/adr/0043). A viewer sees everything else but not the audit trail.
  auditorGroups: ""
  auditorUsers: ""

  # Signs the login session cookie. Blank keeps the backend's own
  # committed dev-insecure default, which it refuses to start with once
  # `INVENTORY_ENVIRONMENT=production` and `auth.enabled` are both set —
  # same fail-fast pattern as `backend.cursorSecret`.
  sessionSecret: ""
  sessionTtlSeconds: 28800

  # Login throttle (docs/adr/0039): after loginMaxFailures wrong passwords for
  # one username, POST /auth/login answers 429 for loginLockoutSeconds, before
  # any LDAP bind. Keep it below AD's own lockout threshold. 0 disables.
  loginMaxFailures: 5
  loginLockoutSeconds: 900

  # Login timeouts, retries and group cache (docs/adr/0042). connectTimeoutSeconds covers LDAP and
  # the AD API; requestTimeoutSeconds is the AD API's per-attempt read timeout (it answers in
  # ~50 ms); ldapReceiveTimeoutSeconds must be whole seconds; adApiRetries retries only
  # timeouts/connection errors/502-504; loginDeadlineSeconds caps the whole attempt;
  # groupCacheTtlSeconds caches group membership in Redis (0 disables; a role change takes up to
  # this long to apply).
  connectTimeoutSeconds: 3
  requestTimeoutSeconds: 4
  ldapReceiveTimeoutSeconds: 5
  adApiRetries: 1
  loginDeadlineSeconds: 10
  groupCacheTtlSeconds: 120

  # Static bearer tokens for a machine caller (e.g. the BMH generator) that
  # can't do an interactive AD login — `Authorization: Bearer <token>`
  # gets admin, auditor (read-only plus the audit trail) or viewer (read-only,
  # no audit trail) access. Blank disables each; the three must differ.
  apiTokens:
    admin: ""
    viewer: ""
    auditor: ""

  # Name of a Secret managed outside this chart, holding the same
  # INVENTORY_* keys (see templates/backend-auth-secret.yaml). Set it and
  # the chart stops rendering its own Secret from the values above entirely.
  existingSecret: ""
