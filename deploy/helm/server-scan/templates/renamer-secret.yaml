{{- $r := .Values.renamer | default dict }}
{{- $j := $r.job | default dict }}
{{- $on := ternary $j.enabled true (hasKey $j "enabled") }}
{{- if and $on $r.url $r.username $r.password (not $r.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-renamer-credentials" .Release.Name }}
  labels:
    app.kubernetes.io/name: {{ printf "%s-renamer-credentials" .Release.Name }}
    app.kubernetes.io/component: maintenance
    app.kubernetes.io/part-of: server-scan
type: Opaque
stringData:
  username: {{ $r.username | quote }}
  password: {{ $r.password | quote }}
{{- end }}
