{{- if .Values.collectors.oneview.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-collector-oneview
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}-collector-oneview
    app.kubernetes.io/component: collector
    app.kubernetes.io/part-of: server-scan
spec:
  schedule: {{ .Values.collectors.oneview.schedule | quote }}
  {{- with .Values.collectors.timeZone }}
  timeZone: {{ . | quote }}
  {{- end }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      {{- if .Values.collectors.jobTtlSeconds }}
      ttlSecondsAfterFinished: {{ .Values.collectors.jobTtlSeconds }}
      {{- end }}
      backoffLimit: {{ .Values.collectors.oneview.backoffLimit }}
      activeDeadlineSeconds: {{ .Values.collectors.oneview.activeDeadlineSeconds }}
      template:
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          containers:
            - name: collector
              image: {{ include "serverScan.apiImage" . | quote }}
              imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
              command: ["python3", "-m", "tools.run_collector", "--manager-type", "ONEVIEW"]
              env:
                - name: INVENTORY_ENVIRONMENT
                  value: production
                - name: INVENTORY_COLLECTOR_NAME_PATTERN
                  value: {{ .Values.collectors.namePattern | quote }}
                {{- if hasKey .Values.collectors.oneview "namePattern" }}
                - name: INVENTORY_ONEVIEW_NAME_PATTERN
                  value: {{ .Values.collectors.oneview.namePattern | quote }}
                {{- end }}
                - name: INVENTORY_ONEVIEW_COLLECT_PSUS
                  value: {{ .Values.collectors.oneview.collectPsus | quote }}
                - name: INVENTORY_ONEVIEW_PSU_CONCURRENCY
                  value: {{ .Values.collectors.oneview.psuConcurrency | quote }}
                - name: INVENTORY_ONEVIEW_COLLECT_CPU_THREADS
                  value: {{ .Values.collectors.oneview.collectCpuThreads | quote }}
                - name: INVENTORY_ONEVIEW_CPU_THREADS_CONCURRENCY
                  value: {{ .Values.collectors.oneview.cpuThreadsConcurrency | quote }}
                - name: INVENTORY_ONEVIEW_API_VERSION
                  value: {{ .Values.collectors.oneview.apiVersion | quote }}
                - name: INVENTORY_ONEVIEW_PAGE_SIZE
                  value: {{ .Values.collectors.oneview.pageSize | quote }}
                - name: INVENTORY_ONEVIEW_VERIFY_TLS
                  value: {{ .Values.collectors.oneview.verifyTls | quote }}
                {{- include "serverScan.dbEnv" . | nindent 16 }}
              envFrom:
                - configMapRef:
                    name: {{ .Release.Name }}-api-config
                - secretRef:
                    name: {{ .Values.collectors.existingSecret | default (printf "%s-collector-credentials" .Release.Name) }}
                # AD login (docs/adr/0034). Blank when auth.enabled is false
                # (this chart's own default), which the backend reads as no
                # different from the variable being unset, so mounting it
                # unconditionally is safe — matches backend-deployment.yaml.
                - secretRef:
                    name: {{ (.Values.auth | default dict).existingSecret | default (printf "%s-auth-credentials" .Release.Name) }}
              resources:
                {{- toYaml .Values.collectors.oneview.resources | nindent 16 }}
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                seccompProfile:
                  type: RuntimeDefault
{{- end }}
