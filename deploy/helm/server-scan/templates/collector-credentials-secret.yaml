{{- if not .Values.collectors.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-collector-credentials
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}-collector-credentials
    app.kubernetes.io/component: collector
    app.kubernetes.io/part-of: server-scan
type: Opaque
stringData:
  {{- with .Values.collectors.ucsManager }}
  INVENTORY_UCS_MANAGER_USERNAME: {{ .username | quote }}
  INVENTORY_UCS_MANAGER_PASSWORD: {{ .password | quote }}
  {{- end }}
  {{- with .Values.collectors.ucsCentral }}
  INVENTORY_UCS_CENTRAL_IP: {{ .ip | quote }}
  INVENTORY_UCS_CENTRAL_USERNAME: {{ .username | quote }}
  INVENTORY_UCS_CENTRAL_PASSWORD: {{ .password | quote }}
  {{- end }}
  {{- with .Values.collectors.redfishStandalone }}
  INVENTORY_REDFISH_USERNAME: {{ .username | default "" | quote }}
  INVENTORY_REDFISH_PASSWORD: {{ .password | default "" | quote }}
  {{- end }}
  {{- with .Values.collectors.oneview }}
  INVENTORY_ONEVIEW_IP: {{ .ip | quote }}
  INVENTORY_ONEVIEW_USERNAME: {{ .username | quote }}
  INVENTORY_ONEVIEW_PASSWORD: {{ .password | quote }}
  {{- end }}
  {{- with .Values.collectors.ome }}
  INVENTORY_OME_IP: {{ .ip | quote }}
  INVENTORY_OME_USERNAME: {{ .username | quote }}
  INVENTORY_OME_PASSWORD: {{ .password | quote }}
  INVENTORY_OME_BMC_USERNAME: {{ .bmcUsername | quote }}
  INVENTORY_OME_BMC_PASSWORD: {{ .bmcPassword | quote }}
  {{- end }}
  {{- with .Values.collectors.kubevirt }}
  INVENTORY_KUBEVIRT_URL: {{ .url | default "" | quote }}
  INVENTORY_KUBEVIRT_USERNAME: {{ .username | default "" | quote }}
  INVENTORY_KUBEVIRT_PASSWORD: {{ .password | default "" | quote }}
  {{- end }}
  {{- /* Intersight signs requests: these are an API Key ID and its PEM, not a login. */}}
  {{- with .Values.collectors.intersight }}
  INVENTORY_INTERSIGHT_IP: {{ .ip | quote }}
  INVENTORY_INTERSIGHT_API_KEY_ID: {{ .apiKeyId | default "" | quote }}
  INVENTORY_INTERSIGHT_API_KEY_PEM: {{ .apiKeyPem | default "" | quote }}
  {{- end }}
{{- end }}
