{{- if and .Values.route.enabled (not .Values.frontend.enabled) }}
{{- /*
API-only install: nothing else claims `/`, so the API takes the whole host.

With `frontend.enabled` there is deliberately NO API Route at all — the
SPA's nginx proxies /api and /health to the API Service in-cluster, so one
Route serves the whole app. See deploy/README.md.
*/ -}}
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ .Release.Name }}-api
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}-api
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: server-scan
  annotations:
    haproxy.router.openshift.io/timeout: {{ printf "%vs" (.Values.route.timeoutSeconds | default 300) | quote }}
spec:
  {{- with .Values.route.host }}
  host: {{ . }}
  {{- end }}
  to:
    kind: Service
    name: {{ .Release.Name }}-api
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
{{- end }}
