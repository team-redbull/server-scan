{{- if not .Values.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-auth-credentials
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}-auth-credentials
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: server-scan
type: Opaque
stringData:
  INVENTORY_AD_API_CLIENT_ID: {{ .Values.auth.adApi.clientId | default "" | quote }}
  # Blank keeps the backend's own committed dev-insecure default —
  # settings.py refuses to start on it once auth.enabled and
  # INVENTORY_ENVIRONMENT=production are both true.
  INVENTORY_SESSION_SECRET: {{ .Values.auth.sessionSecret | default "" | quote }}
  INVENTORY_API_TOKEN_ADMIN: {{ .Values.auth.apiTokens.admin | default "" | quote }}
  INVENTORY_API_TOKEN_VIEWER: {{ .Values.auth.apiTokens.viewer | default "" | quote }}
{{- end }}
