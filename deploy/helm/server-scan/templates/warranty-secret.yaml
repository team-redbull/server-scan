{{- $w := .Values.warranty | default dict }}
{{- if and $w.mongoUri (not $w.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-warranty-db" .Release.Name }}
  labels:
    app.kubernetes.io/name: {{ printf "%s-warranty-db" .Release.Name }}
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: server-scan
type: Opaque
stringData:
  mongo-uri: {{ $w.mongoUri | quote }}
{{- end }}
