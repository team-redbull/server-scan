{{- if .Values.collectors.ucsCentral.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-collector-ucs-central
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}-collector-ucs-central
    app.kubernetes.io/component: collector
    app.kubernetes.io/part-of: server-scan
spec:
  schedule: {{ .Values.collectors.ucsCentral.schedule | quote }}
  {{- with .Values.collectors.timeZone }}
  timeZone: {{ . | quote }}
  {{- end }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      {{- if .Values.collectors.jobTtlSeconds }}
      ttlSecondsAfterFinished: {{ .Values.collectors.jobTtlSeconds }}
      {{- end }}
      backoffLimit: {{ .Values.collectors.ucsCentral.backoffLimit }}
      activeDeadlineSeconds: {{ .Values.collectors.ucsCentral.activeDeadlineSeconds }}
      template:
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          containers:
            - name: collector
              image: {{ include "serverScan.apiImage" . | quote }}
              imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
              command: ["python3", "-m", "tools.run_collector", "--manager-type", "UCS_CENTRAL"]
              env:
                - name: INVENTORY_ENVIRONMENT
                  value: production
                - name: INVENTORY_COLLECTOR_NAME_PATTERN
                  value: {{ .Values.collectors.namePattern | quote }}
                {{- if hasKey .Values.collectors.ucsCentral "namePattern" }}
                - name: INVENTORY_UCS_CENTRAL_NAME_PATTERN
                  value: {{ .Values.collectors.ucsCentral.namePattern | quote }}
                {{- end }}
                - name: INVENTORY_UCS_CENTRAL_DOMAIN_CONCURRENCY
                  value: {{ .Values.collectors.ucsCentral.domainConcurrency | quote }}
                - name: INVENTORY_COLLECTOR_CONNECT_TIMEOUT_SECONDS
                  value: {{ .Values.collectors.ucsCentral.timeoutSeconds | quote }}
                {{- include "serverScan.dbEnv" . | nindent 16 }}
              envFrom:
                - configMapRef:
                    name: {{ .Release.Name }}-api-config
                - secretRef:
                    name: {{ .Values.collectors.existingSecret | default (printf "%s-collector-credentials" .Release.Name) }}
              resources:
                {{- toYaml .Values.collectors.ucsCentral.resources | nindent 16 }}
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                seccompProfile:
                  type: RuntimeDefault
{{- end }}
