apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}-api
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: server-scan
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Release.Name }}-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Release.Name }}-api
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: server-scan
    spec:
      automountServiceAccountToken: false
      containers:
        - name: api
          image: {{ include "serverScan.apiImage" . | quote }}
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.port }}
              protocol: TCP
          env:
            - name: INVENTORY_ENVIRONMENT
              value: production
            {{- include "serverScan.dbEnv" . | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-api-config
            # `GET /servers/available`'s live recheck needs the same manager
            # logins the collector CronJobs already hold (ADR-0032). An
            # unconfigured value degrades to trusting Mongo — see
            # `EnvConnectionResolver` — so this is safe to mount unconditionally.
            - secretRef:
                name: {{ .Values.collectors.existingSecret | default (printf "%s-collector-credentials" .Release.Name) }}
            # AD login (docs/adr/0034). Blank when auth.enabled is false
            # (this chart's own default), which the backend reads as no
            # different from the variable being unset, so mounting it
            # unconditionally is safe.
            - secretRef:
                name: {{ .Values.auth.existingSecret | default (printf "%s-auth-credentials" .Release.Name) }}
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
