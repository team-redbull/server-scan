apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}-api
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: server-scan
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Release.Name }}-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Release.Name }}-api
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: server-scan
    spec:
      {{- $jobTrigger := .Values.jobTrigger | default dict }}
{{- $jobTriggerOn := ternary $jobTrigger.enabled true (hasKey $jobTrigger "enabled") }}
      {{- if $jobTriggerOn }}
      # Needed only to reach the Kubernetes API for "Run job" (docs/adr/0055); the Role is namespaced.
      serviceAccountName: {{ .Release.Name }}-api
      automountServiceAccountToken: true
      {{- else }}
      automountServiceAccountToken: false
      {{- end }}
      {{- $auth := .Values.auth | default dict }}
      {{- $recheck := .Values.recheck | default dict }}
      containers:
        - name: api
          image: {{ include "serverScan.apiImage" . | quote }}
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.port }}
              protocol: TCP
          env:
            - name: INVENTORY_ENVIRONMENT
              value: production
            {{- if $jobTriggerOn }}
            - name: INVENTORY_JOBS_BACKEND
              value: kubernetes
            - name: INVENTORY_JOBS_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: INVENTORY_JOBS_CATALOG_FILE
              value: /etc/server-scan/jobs/catalog.json
            {{- end }}
            {{- include "serverScan.dbEnv" . | nindent 12 }}
            # A volume mount (below), not envFrom: kubelet keeps a mounted
            # ConfigMap's files in sync with no pod restart, unlike env
            # vars (deploy/README.md, "Configuration notes"). AuthService
            # re-reads these on every login, so an admin/viewer group or
            # user-list edit takes effect on the next login attempt.
            - name: INVENTORY_ADMIN_GROUPS_FILE
              value: /etc/server-scan/config/INVENTORY_ADMIN_GROUPS
            - name: INVENTORY_VIEW_GROUPS_FILE
              value: /etc/server-scan/config/INVENTORY_VIEW_GROUPS
            - name: INVENTORY_ADMIN_USERS_FILE
              value: /etc/server-scan/config/INVENTORY_ADMIN_USERS
            - name: INVENTORY_VIEWER_USERS_FILE
              value: /etc/server-scan/config/INVENTORY_VIEWER_USERS
            - name: INVENTORY_AUDITOR_GROUPS_FILE
              value: /etc/server-scan/config/INVENTORY_AUDITOR_GROUPS
            - name: INVENTORY_AUDITOR_USERS_FILE
              value: /etc/server-scan/config/INVENTORY_AUDITOR_USERS
            # The live recheck waits as long as each collector's own CronJob does
            # (ADR-0032): without these the API used the shared 15 s default, which UCS
            # Central's service-profile read exceeds (the CronJob runs with 240 s).
            {{- with include "serverScan.recheckTimeouts" . }}
            - name: INVENTORY_AVAILABLE_RECHECK_TIMEOUTS
              value: {{ . | quote }}
            {{- end }}
            {{- /* No `recheck` block at all (an older values file) keeps values.yaml's 60. */}}
            {{- $readSet := hasKey $recheck "intersightReadTimeoutSeconds" }}
            {{- if or $readSet (not (kindIs "map" .Values.recheck)) }}
            - name: INVENTORY_INTERSIGHT_READ_TIMEOUT_SECONDS
              value: {{ ternary $recheck.intersightReadTimeoutSeconds 60 $readSet | quote }}
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-api-config
            # `GET /servers/available`'s live recheck needs the logins the
            # server-scan-collectors release holds (ADR-0032). Optional: until that
            # release exists every manager is unconfigured and the API trusts Mongo.
            - secretRef:
                name: {{ $recheck.credentialsSecret | default "server-scan-collectors-collector-credentials" }}
                optional: true
            # AD login (docs/adr/0034). Blank when auth.enabled is false
            # (this chart's own default), which the backend reads as no
            # different from the variable being unset, so mounting it
            # unconditionally is safe.
            - secretRef:
                name: {{ $auth.existingSecret | default (printf "%s-auth-credentials" .Release.Name) }}
          volumeMounts:
            - name: api-config
              mountPath: /etc/server-scan/config
              readOnly: true
            {{- if $jobTriggerOn }}
            - name: jobs-catalog
              mountPath: /etc/server-scan/jobs
              readOnly: true
            {{- end }}
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: api-config
          configMap:
            name: {{ .Release.Name }}-api-config
        {{- if $jobTriggerOn }}
        - name: jobs-catalog
          configMap:
            name: {{ .Release.Name }}-jobs-catalog
        {{- end }}
