{{- /* KubeVirt VMs through kubevirt-redfish (docs/adr/0058). Every key is read through `$kv`: the platform repo's values.yaml may not have this block. */ -}}
{{- $kv := (.Values.collectors | default dict).kubevirt | default dict }}
{{- if $kv.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-collector-kubevirt
  labels:
    server-scan.io/triggerable: "true"
    app.kubernetes.io/name: {{ .Release.Name }}-collector-kubevirt
    app.kubernetes.io/component: collector
    app.kubernetes.io/part-of: server-scan
spec:
  schedule: {{ $kv.schedule | default "0 */3 * * *" | quote }}
  {{- with .Values.collectors.timeZone }}
  timeZone: {{ . | quote }}
  {{- end }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      {{- if .Values.collectors.jobTtlSeconds }}
      ttlSecondsAfterFinished: {{ .Values.collectors.jobTtlSeconds }}
      {{- end }}
      backoffLimit: {{ $kv.backoffLimit | default 1 }}
      activeDeadlineSeconds: {{ $kv.activeDeadlineSeconds | default 2400 }}
      template:
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          containers:
            - name: collector
              image: {{ include "serverScan.apiImage" . | quote }}
              imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
              command: ["python3", "-m", "tools.run_collector", "--manager-type", "KUBEVIRT"]
              env:
                - name: INVENTORY_ENVIRONMENT
                  value: production
                {{- if hasKey $kv "connectTimeoutSeconds" }}
                - name: INVENTORY_COLLECTOR_CONNECT_TIMEOUT_SECONDS
                  value: {{ $kv.connectTimeoutSeconds | quote }}
                {{- end }}
                - name: INVENTORY_COLLECTOR_NAME_PATTERN
                  value: {{ .Values.collectors.namePattern | quote }}
                {{- if hasKey $kv "namePattern" }}
                - name: INVENTORY_KUBEVIRT_NAME_PATTERN
                  value: {{ $kv.namePattern | quote }}
                {{- end }}
                - name: INVENTORY_KUBEVIRT_VERIFY_TLS
                  value: {{ ternary $kv.verifyTls true (hasKey $kv "verifyTls") | quote }}
                {{- if $kv.caBundleConfigMap }}
                - name: INVENTORY_KUBEVIRT_CA_BUNDLE
                  value: /etc/kubevirt-ca/ca-bundle.crt
                {{- end }}
                - name: INVENTORY_KUBEVIRT_CONCURRENCY
                  value: {{ $kv.concurrency | default 4 | quote }}
                - name: INVENTORY_KUBEVIRT_READ_TIMEOUT_SECONDS
                  value: {{ $kv.readTimeoutSeconds | default 35 | quote }}
                - name: INVENTORY_KUBEVIRT_VM_BUDGET_SECONDS
                  value: {{ $kv.vmBudgetSeconds | default 60 | quote }}
                - name: INVENTORY_KUBEVIRT_RUN_BUDGET_SECONDS
                  value: {{ $kv.runBudgetSeconds | default 1800 | quote }}
                {{- include "serverScan.dbEnv" . | nindent 16 }}
              envFrom:
                - configMapRef:
                    name: {{ .Release.Name }}-api-config
                - secretRef:
                    name: {{ .Values.collectors.existingSecret | default (printf "%s-collector-credentials" .Release.Name) }}
                - secretRef:
                    name: {{ (.Values.auth | default dict).existingSecret | default (printf "%s-auth-credentials" .Release.Name) }}
              {{- if $kv.caBundleConfigMap }}
              volumeMounts:
                - name: ca-bundle
                  mountPath: /etc/kubevirt-ca
                  readOnly: true
              {{- end }}
              resources:
                {{- toYaml ($kv.resources | default (dict "requests" (dict "cpu" "50m" "memory" "128Mi") "limits" (dict "memory" "256Mi"))) | nindent 16 }}
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                seccompProfile:
                  type: RuntimeDefault
          {{- if $kv.caBundleConfigMap }}
          volumes:
            - name: ca-bundle
              configMap:
                name: {{ $kv.caBundleConfigMap }}
          {{- end }}
{{- end }}
