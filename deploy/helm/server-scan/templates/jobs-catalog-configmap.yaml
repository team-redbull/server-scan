{{- /* This chart's triggerable CronJobs and whether values.yaml turns them on, for the Jobs page: a disabled job renders no CronJob, so the API cannot learn it from the cluster. The collectors release's labelled CronJobs are listed from the cluster without an entry here. Mounted (not env) so a values change shows without a pod restart. Each key is read tolerantly: the platform repo's values.yaml may lack newer ones. */ -}}
{{- $jobTrigger := .Values.jobTrigger | default dict }}
{{- $jobTriggerOn := ternary $jobTrigger.enabled true (hasKey $jobTrigger "enabled") }}
{{- if $jobTriggerOn }}
{{- $c := .Values.collectors | default dict }}
{{- $pr := $c.prune | default dict }}
{{- $ar := $c.auditRetention | default dict }}
{{- $rel := .Release.Name }}
{{- $jobs := list
  (dict "name" (printf "%s-prune-servers" $rel) "enabled" ($pr.enabled | default false))
  (dict "name" (printf "%s-prune-events" $rel) "enabled" (ternary $ar.enabled true (hasKey $ar "enabled")))
}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $rel }}-jobs-catalog
  labels:
    app.kubernetes.io/name: {{ $rel }}-api
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: server-scan
data:
  catalog.json: {{ toJson $jobs | quote }}
{{- end }}
