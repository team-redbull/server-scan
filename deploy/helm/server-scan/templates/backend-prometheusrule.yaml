{{- if .Values.metrics.prometheusRule.enabled }}
{{- /*
The alerts ADR-0029 exists for. Thresholds are values so an estate on a
different collector or membership-job cadence tunes them without editing
this file — the two silence thresholds are deliberately separate
(silentForSeconds for the 3h-cadence vendor collectors,
membershipSilentForSeconds for the 15min-cadence nodes-status jobs), not
one shared value, or a deployment on the default schedules tolerates
either 48 missed membership-job runs or 2 missed collector runs, never
both correctly.

`required`, because Helm renders a missing value as an empty string with
no warning: a values file that mis-nests these keys once produced
`expr: server_scan:collector_silent_seconds >` — which helm lint, helm
template and promtool (run on the chart's own defaults) all passed, and
only OpenShift's PrometheusRule admission webhook rejected, at sync time.
*/ -}}
{{- $stale := required "metrics.prometheusRule.staleServersThreshold must be set — check the values file's nesting" .Values.metrics.prometheusRule.staleServersThreshold }}
{{- $silent := required "metrics.prometheusRule.silentForSeconds must be set — check the values file's nesting" .Values.metrics.prometheusRule.silentForSeconds }}
{{- $membershipSilent := required "metrics.prometheusRule.membershipSilentForSeconds must be set — check the values file's nesting" .Values.metrics.prometheusRule.membershipSilentForSeconds }}
{{- $membershipUnmatched := required "metrics.prometheusRule.membershipUnmatchedThreshold must be set — check the values file's nesting" .Values.metrics.prometheusRule.membershipUnmatchedThreshold }}
{{- /*
The login/dependency alerts below (ADR-0042) read their thresholds with `default`, not `required`:
the Deploy job renders this template against redbull-platform's own values.yaml, which predates
these keys, and a `required` would fail every deploy until that file is updated.
*/ -}}
{{- $loginFailRatio := .Values.metrics.prometheusRule.loginDependencyFailureRatio | default 0.2 }}
{{- $loginSlow := .Values.metrics.prometheusRule.loginSlowSeconds | default 3 }}
{{- /*
The audit-retention alert (ADR-0045) is rendered only while the prune-events CronJob really deletes.
Same hasKey reads as prune-events-cronjob.yaml (`default` would turn false and 0 into the fallback);
older platform values.yaml lack `collectors.auditRetention`, which means report-only: no alert.
*/ -}}
{{- $ar := .Values.collectors.auditRetention | default dict }}
{{- $arEnabled := ternary $ar.enabled true (hasKey $ar "enabled") }}
{{- $arReportOnly := ternary $ar.reportOnly true (hasKey $ar "reportOnly") }}
{{- $arDays := ternary $ar.retentionDays 180 (hasKey $ar "retentionDays") | int }}
{{- $arSlack := .Values.metrics.prometheusRule.auditRetentionSlackDays | default 14 | int }}
{{- /*
The pod rules (README "API and frontend pod rules") have two modes, metrics.prometheusRule.evaluationScope.
`leaf-prometheus` (default) labels the PrometheusRule so the user-workload Prometheus evaluates it, and
the pod rules then read only series that Prometheus scrapes (`up`, `process_start_time_seconds`).
`thanos-ruler` leaves the rule unlabeled and reads kube-state-metrics and cAdvisor series. Every threshold
is read with `default` like the login ones above. The frontend exposes no metrics endpoint: its rules
exist only in thanos-ruler mode while frontend.enabled. A missing series makes an alert inert, never
firing (no `or vector(0)`); the one deliberate `absent_over_time` is leaf mode's ServerScanApiDown, because
`up` itself vanishes when every API pod is gone.
*/ -}}
{{- $scope := (.Values.metrics.prometheusRule.evaluationScope | default "leaf-prometheus") }}
{{- if not (has $scope (list "leaf-prometheus" "thanos-ruler")) }}
{{- fail (printf "metrics.prometheusRule.evaluationScope must be \"leaf-prometheus\" or \"thanos-ruler\", got %q" (toString $scope)) }}
{{- end }}
{{- $leaf := eq $scope "leaf-prometheus" }}
{{- $userLabels := .Values.metrics.prometheusRule.labels | default dict }}
{{- $scopeKey := "openshift.io/prometheus-rule-evaluation-scope" }}
{{- if hasKey $userLabels $scopeKey }}
{{- $userScope := get $userLabels $scopeKey }}
{{- if and $leaf (ne $userScope "leaf-prometheus") }}
{{- fail (printf "metrics.prometheusRule.labels sets %s=%q but evaluationScope is leaf-prometheus" $scopeKey (toString $userScope)) }}
{{- end }}
{{- if and (not $leaf) (eq $userScope "leaf-prometheus") }}
{{- fail (printf "metrics.prometheusRule.labels sets %s=leaf-prometheus but evaluationScope is thanos-ruler: its kube-state-metrics rules would never see their series" $scopeKey) }}
{{- end }}
{{- end }}
{{- $restarts := .Values.metrics.prometheusRule.podRestartsThreshold | default 3 }}
{{- $memRatio := .Values.metrics.prometheusRule.podMemoryLimitRatio | default 0.9 }}
{{- $apiReplicas := .Values.backend.replicaCount | default 1 | int }}
{{- $a := printf "%s-api" .Release.Name }}
{{- $f := printf "%s-frontend" .Release.Name }}
{{- $feOn := and (not $leaf) .Values.frontend (.Values.frontend.enabled | default false) }}
{{- $podRe := printf "%s-[a-z0-9]+-[a-z0-9]+" $a }}
{{- if $feOn }}{{ $podRe = printf "%s|%s-[a-z0-9]+-[a-z0-9]+" $podRe $f }}{{ end }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ .Release.Name }}-api
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}-api
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: server-scan
    {{- if and $leaf (not (hasKey $userLabels "openshift.io/prometheus-rule-evaluation-scope")) }}
    openshift.io/prometheus-rule-evaluation-scope: leaf-prometheus
    {{- end }}
    {{- with .Values.metrics.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    # The fleet gauges describe the FLEET, not a pod, but every API replica
    # exports them, so the raw series come back once per pod. These collapse
    # them: `server_scan:<gauge>:max` is one series per label set, and what
    # the alerts below read — an alert on the raw series would fire once
    # per replica. Query these in the console, not the raw names.
    - name: server-scan.fleet.rules
      interval: 30s
      rules:
        - record: server_scan:servers:max
          expr: max by (namespace, source_provider) (server_scan_servers)
        - record: server_scan:servers_pruned_24h:max
          expr: max by (namespace, source_provider) (server_scan_servers_pruned_24h)
        - record: server_scan:servers_stale:max
          expr: max by (namespace, source_provider) (server_scan_servers_stale)
        - record: server_scan:servers_unreachable:max
          expr: max by (namespace, source_provider) (server_scan_servers_unreachable)
        - record: server_scan:servers_partial:max
          expr: max by (namespace, source_provider) (server_scan_servers_partial)
        - record: server_scan:policy_active:max
          expr: max by (namespace, policy_key) (server_scan_policy_active)
        - record: server_scan:collector_last_run_duration_seconds:max
          expr: max by (namespace, source_provider) (server_scan_collector_last_run_duration_seconds)
        - record: server_scan:collector_last_run_servers_fetched:max
          expr: max by (namespace, source_provider) (server_scan_collector_last_run_servers_fetched)
        - record: server_scan:collector_last_run_ingest_errors:max
          expr: max by (namespace, source_provider) (server_scan_collector_last_run_ingest_errors)
        - record: server_scan:collector_last_run_collection_errors:max
          expr: max by (namespace, source_provider) (server_scan_collector_last_run_collection_errors)
        - record: server_scan:collector_last_run_partial:max
          expr: max by (namespace, source_provider) (server_scan_collector_last_run_partial)
        - record: server_scan:collector_last_run_age_seconds
          expr: time() - max by (namespace, source_provider) (server_scan_collector_last_run_timestamp_seconds)
        - record: server_scan:collector_last_seen_timestamp_seconds:max
          expr: max by (namespace, source_provider) (server_scan_collector_last_seen_timestamp_seconds)
        - record: server_scan:cluster_servers_held:max
          expr: max by (namespace, cluster) (server_scan_cluster_servers_held)
        - record: server_scan:cluster_last_reported_timestamp_seconds:max
          expr: max by (namespace, cluster) (server_scan_cluster_last_reported_timestamp_seconds)
        - record: server_scan:servers_by_health:max
          expr: max by (namespace, severity) (server_scan_servers_by_health)
        - record: server_scan:servers_in_maintenance:max
          expr: max by (namespace) (server_scan_servers_in_maintenance)
        - record: server_scan:duplicate_name_groups:max
          expr: max by (namespace) (server_scan_duplicate_name_groups)
        - record: server_scan:duplicate_name_servers:max
          expr: max by (namespace) (server_scan_duplicate_name_servers)
        - record: server_scan:openshift_name_mismatch_servers:max
          expr: max by (namespace) (server_scan_openshift_name_mismatch_servers)
        - record: server_scan:openshift_contested_servers:max
          expr: max by (namespace) (server_scan_openshift_contested_servers)
        - record: server_scan:membership_last_run_timestamp_seconds:max
          expr: max by (namespace, kind, reported_by) (server_scan_membership_last_run_timestamp_seconds)
        - record: server_scan:membership_last_run_duration_seconds:max
          expr: max by (namespace, kind, reported_by) (server_scan_membership_last_run_duration_seconds)
        - record: server_scan:membership_last_run_observed:max
          expr: max by (namespace, kind, reported_by) (server_scan_membership_last_run_observed)
        - record: server_scan:membership_last_run_matched:max
          expr: max by (namespace, kind, reported_by) (server_scan_membership_last_run_matched)
        - record: server_scan:membership_last_run_unmatched:max
          expr: max by (namespace, kind, reported_by) (server_scan_membership_last_run_unmatched)
        - record: server_scan:membership_last_run_partial:max
          expr: max by (namespace, kind, reported_by) (server_scan_membership_last_run_partial)
        - record: server_scan:membership_last_run_matched_by_serial:max
          expr: max by (namespace, kind, reported_by) (server_scan_membership_last_run_matched_by_serial)
        - record: server_scan:membership_last_run_unresolved:max
          expr: max by (namespace, kind, reported_by) (server_scan_membership_last_run_unresolved)
        - record: server_scan:audit_events:max
          expr: max by (namespace) (server_scan_audit_events)
        - record: server_scan:collector_last_run_servers_unchanged:max
          expr: max by (namespace, source_provider) (server_scan_collector_last_run_servers_unchanged)
        - record: server_scan:collector_last_run_unchanged_ratio
          expr: server_scan:collector_last_run_servers_unchanged:max / (server_scan:collector_last_run_servers_fetched:max > 0)
        # Age in seconds, so a dashboard needs no arithmetic.
        - record: server_scan:audit_oldest_event_age_seconds
          expr: time() - max by (namespace) (server_scan_audit_oldest_event_timestamp_seconds)
        - record: server_scan:collector_silent_seconds
          expr: time() - max by (namespace, source_provider) (server_scan_collector_last_seen_timestamp_seconds)
        # From the membership job's RUN record, which every real run writes. Not from
        # server_scan_cluster_last_reported_timestamp_seconds: openshift.last_reported_at only moves when a
        # membership CHANGES (an unchanged one is not rewritten), so on a stable cluster it ages for weeks.
        - record: server_scan:cluster_silent_seconds
          expr: time() - max by (namespace, cluster) (label_replace(server_scan_membership_last_run_timestamp_seconds, "cluster", "$1", "reported_by", "(.*)"))
        - record: server_scan:membership_run_silent_seconds
          expr: time() - max by (namespace, kind, reported_by) (server_scan_membership_last_run_timestamp_seconds)

    # Login and external-dependency calls (ADR-0042). Unlike the fleet gauges these are per-request
    # counters and histograms, so they are SUMMED across replicas, not `max`ed. `outcome` values
    # that are not failures: ok, invalid_credentials (a wrong password), verified, not_found, and
    # cancelled (the caller went away) — everything else is a timeout or an error.
    - name: server-scan.auth.rules
      interval: 30s
      rules:
        - record: server_scan:auth_logins:rate5m
          expr: sum by (namespace, outcome) (rate(auth_logins_total[5m]))
        - record: server_scan:login_duration_seconds:p95
          expr: histogram_quantile(0.95, sum by (namespace, le) (rate(http_request_duration_seconds_bucket{path="/api/v1/auth/login"}[5m])))
        - record: server_scan:login_duration_seconds:p99
          expr: histogram_quantile(0.99, sum by (namespace, le) (rate(http_request_duration_seconds_bucket{path="/api/v1/auth/login"}[5m])))
        - record: server_scan:dependency_calls:rate5m
          expr: sum by (namespace, dependency, outcome) (rate(dependency_call_duration_seconds_count[5m]))
        - record: server_scan:dependency_call_duration_seconds:p95
          expr: histogram_quantile(0.95, sum by (namespace, dependency, le) (rate(dependency_call_duration_seconds_bucket[5m])))
        - record: server_scan:dependency_call_duration_seconds:p99
          expr: histogram_quantile(0.99, sum by (namespace, dependency, le) (rate(dependency_call_duration_seconds_bucket[5m])))
        - record: server_scan:dependency_failure_ratio:rate10m
          expr: sum by (namespace, dependency) (rate(dependency_call_duration_seconds_count{outcome!~"ok|invalid_credentials|verified|not_found|cancelled"}[10m])) / sum by (namespace, dependency) (rate(dependency_call_duration_seconds_count{outcome!="cancelled"}[10m]))

    - name: server-scan.auth
      rules:
        - alert: ServerScanLoginDependencyFailing
          expr: server_scan:dependency_failure_ratio:rate10m{dependency=~"ldap|ad_api"} > {{ $loginFailRatio }}
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "{{ "{{ $labels.dependency }}" }} calls on the login path are failing ({{ "{{ $value | humanizePercentage }}" }} over 10m)"
            description: "Logins are returning 503 or needing retries. The API log's `ldap.bind_failed` / `ad_api.attempt_failed` lines carry `reason` (connect_timeout, read_timeout, http_503, ...). `server_scan:dependency_calls:rate5m` splits it by outcome."
        - alert: ServerScanLoginSlow
          expr: server_scan:login_duration_seconds:p95 > {{ $loginSlow }}
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "POST /auth/login p95 is {{ "{{ $value | humanizeDuration }}" }} (normal is well under 1s)"
            description: "A fleet-wide HTTP latency panel hides this; this reads the login route alone. `server_scan:dependency_call_duration_seconds:p95{dependency=~\"ldap|ad_api\"}` says which hop is slow."
        - alert: ServerScanAvailableRecheckFailing
          expr: server_scan:dependency_failure_ratio:rate10m{dependency=~"vendor_.*"} > {{ $loginFailRatio }}
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "GET /servers/available live rechecks against {{ "{{ $labels.dependency }}" }} are failing"
            description: "The vendor manager is not answering the per-server recheck; callers get an error or a stale-trusting result. The API log's `available.recheck_failed` lines name the server and the exception."

    - name: server-scan.fleet
      rules:
        - alert: ServerScanCollectorSilent
          expr: server_scan:collector_silent_seconds > {{ $silent }}
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Collector {{ "{{ $labels.source_provider }}" }} has not read any server for over {{ $silent }}s"
            description: "Its CronJob is failing, suspended, or never ran. Check `oc get jobs -n {{ .Release.Namespace }}` and the newest pod's logs."
        - alert: ServerScanServersStale
          expr: server_scan:servers_stale:max > {{ $stale }}
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "{{ "{{ $value }}" }} {{ "{{ $labels.source_provider }}" }} servers not collected within INVENTORY_STALE_AFTER_SECONDS"
            description: "The collector is running but these servers are not being read — dead BMCs, rejected logins, or hosts dropped from the manager. `server_scan:servers_unreachable:max` says how many are the first kind."
        - alert: ServerScanClusterSilent
          expr: server_scan:cluster_silent_seconds > {{ $membershipSilent }}
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "No membership job for {{ "{{ $labels.cluster }}" }} has completed a run for over {{ $membershipSilent }}s"
            description: "Neither its nodes nor its agents job has finished a run (the run record is written on every real run, matched or not, changed or not), so its servers stay INSTALLED forever and nothing else notices. Check the nodes-status release in that cluster."
        - alert: ServerScanCollectorRunPartial
          expr: server_scan:collector_last_run_partial:max == 1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Collector {{ "{{ $labels.source_provider }}" }}'s last run did not see the whole fleet"
            description: "The run exited PARTIAL: TLS failures, per-host budgets exceeded, or ingest errors — not merely dead BMCs. `server_scan:collector_last_run_collection_errors:max` and `:ingest_errors:max` say how many; the newest pod's log says which."
        - alert: ServerScanFleetSnapshotFailing
          expr: sum by (namespace) (increase(server_scan_fleet_snapshot_failures_total[15m])) > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "The API cannot compute its fleet gauges"
            description: "Every server_scan_* gauge is frozen at its last good value. Almost always MongoDB — check mongo_ping_failures_total."
        - alert: ServerScanMembershipRunSilent
          expr: server_scan:membership_run_silent_seconds > {{ $membershipSilent }}
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "The {{ "{{ $labels.kind }}" }} membership job for {{ "{{ $labels.reported_by }}" }} has not completed a run for over {{ $membershipSilent }}s"
            description: "Its CronJob is failing, suspended, or never ran. This is the per-job view: ServerScanClusterSilent fires only when none of a cluster's jobs has completed a run. Check `oc get jobs -n {{ .Release.Namespace }}` and the newest pod's logs."
        - alert: ServerScanMembershipUnmatched
          expr: server_scan:membership_last_run_unmatched:max > {{ $membershipUnmatched }}
          for: 60m
          labels:
            severity: warning
          annotations:
            summary: "{{ "{{ $value }}" }} hostname(s) the {{ "{{ $labels.kind }}" }} job for {{ "{{ $labels.reported_by }}" }} reports have no matching server"
            description: "The job itself is running fine (see ServerScanMembershipRunSilent for that), but it is reporting hosts the vendor collectors have never ingested — a naming mismatch, a not-yet-collected server, or a host that should be in INVENTORY_OPENSHIFT_EXCLUDE_NAME_PARTS. The newest pod's log lists the hostnames."

    # API and frontend pods, see README "API and frontend pod rules".
    - name: server-scan.pods.rules
      interval: 30s
      rules:
{{- if $leaf }}
        # Leaf mode: desired count is backend.replicaCount, injected by Helm (no kube-state-metrics).
        - record: server_scan:api_replicas_available:ratio
          expr: count by (namespace) (up{job="{{ $a }}"} == 1) / {{ $apiReplicas }}
        - record: server_scan:api_container_restarts:increase30m
          expr: sum by (namespace) (changes(process_start_time_seconds{job="{{ $a }}"}[30m]))
{{- else }}
        - record: server_scan:api_replicas_available:ratio
          expr: kube_deployment_status_replicas_ready{deployment="{{ $a }}"} / (kube_deployment_spec_replicas{deployment="{{ $a }}"} > 0)
        - record: server_scan:api_container_restarts:increase30m
          expr: sum by (namespace) (increase(kube_pod_container_status_restarts_total{pod=~"{{ $a }}-[a-z0-9]+-[a-z0-9]+",container="api"}[30m]))
        - record: server_scan:api_memory_limit_ratio:max
          expr: max by (namespace) (container_memory_working_set_bytes{container="api",pod=~"{{ $a }}-[a-z0-9]+-[a-z0-9]+"} / on (namespace,pod,container) kube_pod_container_resource_limits{resource="memory"})
{{- if $feOn }}
        - record: server_scan:frontend_replicas_available:ratio
          expr: kube_deployment_status_replicas_ready{deployment="{{ $f }}"} / (kube_deployment_spec_replicas{deployment="{{ $f }}"} > 0)
        - record: server_scan:frontend_container_restarts:increase30m
          expr: sum by (namespace) (increase(kube_pod_container_status_restarts_total{pod=~"{{ $f }}-[a-z0-9]+-[a-z0-9]+",container="frontend"}[30m]))
        - record: server_scan:frontend_memory_limit_ratio:max
          expr: max by (namespace) (container_memory_working_set_bytes{container="frontend",pod=~"{{ $f }}-[a-z0-9]+-[a-z0-9]+"} / on (namespace,pod,container) kube_pod_container_resource_limits{resource="memory"})
{{- end }}
{{- end }}

    - name: server-scan.pods
      rules:
{{- if $leaf }}
        - alert: ServerScanApiReplicasUnavailable
          expr: server_scan:api_replicas_available:ratio < 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Only {{ "{{ $value | humanizePercentage }}" }} of the {{ $apiReplicas }} desired {{ $a }} replicas are scraped as up in {{ "{{ $labels.namespace }}" }}"
            description: "Signal: `up{job=\"{{ $a }}\"} == 1` counted against backend.replicaCount ({{ $apiReplicas }}, injected by Helm: keep it in step with the Deployment). A pod is failing its metrics scrape, or a rollout is stuck. Check `oc get pods -n {{ .Release.Namespace }}`. If every replica is down see ServerScanApiScrapeDown."
        - alert: ServerScanApiDown
          expr: absent_over_time(up{job="{{ $a }}", namespace="{{ .Release.Namespace }}"}[10m])
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "No {{ $a }} target has reported `up` for 10 minutes in {{ .Release.Namespace }}"
            description: "Signal: `up` has no series at all: every API pod is gone (deleted, or scaled to zero, which also fires this), the ServiceMonitor target vanished, or the `job` label differs from the Service name {{ $a }}. ServerScanApiScrapeDown covers targets that exist but fail the scrape."
{{- else }}
        - alert: ServerScanApiReplicasUnavailable
          expr: kube_deployment_status_replicas_ready{deployment="{{ $a }}"} < kube_deployment_spec_replicas{deployment="{{ $a }}"}
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "{{ "{{ $value }}" }} of the desired {{ $a }} replicas are ready in {{ "{{ $labels.namespace }}" }}"
            description: "Signal: kube-state-metrics `kube_deployment_status_replicas_ready` / `_spec_replicas` (the exporter must expose both). Fewer API pods are ready than the Deployment asks for, for 15 minutes: a failing readiness probe (/health/ready), a stuck rollout or an unschedulable pod. Check `oc get pods -n {{ .Release.Namespace }}`."
        - alert: ServerScanApiDown
          expr: kube_deployment_status_replicas_ready{deployment="{{ $a }}"} == 0 and on (namespace, deployment) kube_deployment_spec_replicas{deployment="{{ $a }}"} > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "No {{ $a }} replica is ready in {{ "{{ $labels.namespace }}" }}"
            description: "Signal: kube-state-metrics `kube_deployment_status_replicas_ready` (the exporter must expose it and `_spec_replicas`). The API and the UI behind it are unreachable. This series exists whenever the Deployment does, so it does not depend on a scrape. It stays quiet when the Deployment is scaled to zero on purpose."
{{- end }}
        - alert: ServerScanApiScrapeDown
          expr: max by (namespace) (up{job="{{ $a }}"}) == 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Prometheus cannot scrape any {{ $a }} replica in {{ "{{ $labels.namespace }}" }}"
            description: "Signal: `up`. All replicas fail the /metrics scrape (not one pod). The `job` label equals the Service name, {{ $a }}; if the ServiceMonitor yields another job label this alert is inert, so check `up` in Observe -> Metrics. The fleet alerts above go silent too."
{{- if $feOn }}
        - alert: ServerScanFrontendReplicasUnavailable
          expr: kube_deployment_status_replicas_ready{deployment="{{ $f }}"} < kube_deployment_spec_replicas{deployment="{{ $f }}"}
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "{{ "{{ $value }}" }} of the desired {{ $f }} replicas are ready in {{ "{{ $labels.namespace }}" }}"
            description: "Signal: kube-state-metrics `kube_deployment_status_replicas_ready` / `_spec_replicas`. Fewer frontend pods are ready than the Deployment asks for, for 15 minutes. Check `oc get pods -n {{ .Release.Namespace }}`."
        - alert: ServerScanFrontendDown
          expr: kube_deployment_status_replicas_ready{deployment="{{ $f }}"} == 0 and on (namespace, deployment) kube_deployment_spec_replicas{deployment="{{ $f }}"} > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "No {{ $f }} replica is ready in {{ "{{ $labels.namespace }}" }}"
            description: "Signal: kube-state-metrics `kube_deployment_status_replicas_ready`. The UI is unreachable; the API may be fine."
{{- end }}
        - alert: ServerScanApiRestarting
          expr: server_scan:api_container_restarts:increase30m > {{ $restarts }}
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "The API container restarted {{ "{{ $value | humanize }}" }} times in 30m"
            description: "{{ if $leaf }}Signal: changes in `process_start_time_seconds` (a process restart, whatever the cause). {{ else }}Signal: kube-state-metrics container restarts. {{ end }}A crash loop or repeated OOM kills. A single restart is deliberately not alerted. `oc logs --previous` on the newest pod."
{{- if $feOn }}
        - alert: ServerScanFrontendRestarting
          expr: server_scan:frontend_container_restarts:increase30m > {{ $restarts }}
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "The frontend container restarted {{ "{{ $value | humanize }}" }} times in 30m"
            description: "Signal: kube-state-metrics container restarts. A crash loop or repeated OOM kills. `oc logs --previous` on the newest pod."
{{- end }}
{{- if not $leaf }}
        - alert: ServerScanPodWaiting
          expr: max by (namespace, pod, reason) (kube_pod_container_status_waiting_reason{pod=~"{{ $podRe }}",reason=~"CrashLoopBackOff|ImagePullBackOff|ErrImagePull|CreateContainerConfigError"}) == 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ "{{ $labels.pod }}" }} has been waiting with {{ "{{ $labels.reason }}" }} for 10m"
            description: "Signal: kube-state-metrics waiting reason. The container cannot start: a crash loop, an image that cannot be pulled (mirror or pull secret) or a missing ConfigMap/Secret key. `oc describe pod {{ "{{ $labels.pod }}" }} -n {{ .Release.Namespace }}`."
        - alert: ServerScanPodOOMKilled
          expr: kube_pod_container_status_last_terminated_reason{reason="OOMKilled",pod=~"{{ $podRe }}"} == 1 and on (namespace,pod,container) increase(kube_pod_container_status_restarts_total{pod=~"{{ $podRe }}"}[10m]) > 0
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: "Container {{ "{{ $labels.container }}" }} in {{ "{{ $labels.pod }}" }} was OOM-killed and restarted"
            description: "Signal: kube-state-metrics last-terminated reason. The memory limit was hit (512Mi API, 128Mi frontend by default). Compare with `server_scan:api_memory_limit_ratio:max` and raise the limit if the growth is legitimate."
        - alert: ServerScanApiMemoryNearLimit
          expr: server_scan:api_memory_limit_ratio:max > {{ $memRatio }}
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "An API pod uses {{ "{{ $value | humanizePercentage }}" }} of its memory limit"
            description: "Signal: cAdvisor working set over the kube-state-metrics memory limit. The working set is close to the limit, so an OOM kill is likely. Raise backend.resources limits.memory or find the growth."
{{- if $feOn }}
        - alert: ServerScanFrontendMemoryNearLimit
          expr: server_scan:frontend_memory_limit_ratio:max > {{ $memRatio }}
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "A frontend pod uses {{ "{{ $value | humanizePercentage }}" }} of its memory limit"
            description: "Signal: cAdvisor working set over the kube-state-metrics memory limit. The working set is close to the limit, so an OOM kill is likely."
{{- end }}
{{- end }}
{{- if and $arEnabled (not $arReportOnly) (gt $arDays 0) }}

    - name: server-scan.audit
      rules:
        - alert: ServerScanAuditRetentionBehind
          expr: server_scan:audit_oldest_event_age_seconds > {{ mul (add $arDays $arSlack) 86400 }}
          for: 6h
          labels:
            severity: warning
          annotations:
            summary: "The oldest audit event is {{ "{{ $value | humanizeDuration }}" }} old, past the {{ $arDays }}-day retention plus {{ $arSlack }} days of slack"
            description: "The retention job is not keeping up: it is not running, failing, or suspended. Look at the newest `prune-events` Job's logs for `audit_retention.failed`. Expected once, right after `reportOnly` is set to false, until the first weekly runs have drained the backlog."
{{- end }}
{{- end }}
