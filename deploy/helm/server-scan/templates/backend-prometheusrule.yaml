{{- if .Values.metrics.prometheusRule.enabled }}
{{- /*
The alerts ADR-0029 exists for. Thresholds are values so an estate on a
different collector or membership-job cadence tunes them without editing
this file — the two silence thresholds are deliberately separate
(silentForSeconds for the 6h-cadence vendor collectors,
membershipSilentForSeconds for the 15min-cadence nodes-status jobs), not
one shared value, or a deployment on the default schedules tolerates
either 48 missed membership-job runs or 2 missed collector runs, never
both correctly.

`required`, because Helm renders a missing value as an empty string with
no warning: a values file that mis-nests these keys once produced
`expr: server_scan:collector_silent_seconds >` — which helm lint, helm
template and promtool (run on the chart's own defaults) all passed, and
only OpenShift's PrometheusRule admission webhook rejected, at sync time.
*/ -}}
{{- $stale := required "metrics.prometheusRule.staleServersThreshold must be set — check the values file's nesting" .Values.metrics.prometheusRule.staleServersThreshold }}
{{- $silent := required "metrics.prometheusRule.silentForSeconds must be set — check the values file's nesting" .Values.metrics.prometheusRule.silentForSeconds }}
{{- $membershipSilent := required "metrics.prometheusRule.membershipSilentForSeconds must be set — check the values file's nesting" .Values.metrics.prometheusRule.membershipSilentForSeconds }}
{{- $membershipUnmatched := required "metrics.prometheusRule.membershipUnmatchedThreshold must be set — check the values file's nesting" .Values.metrics.prometheusRule.membershipUnmatchedThreshold }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ .Release.Name }}-api
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}-api
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: server-scan
    {{- with .Values.metrics.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    # The fleet gauges describe the FLEET, not a pod, but every API replica
    # exports them, so the raw series come back once per pod. These collapse
    # them: `server_scan:<gauge>:max` is one series per label set, and what
    # the alerts below read — an alert on the raw series would fire once
    # per replica. Query these in the console, not the raw names.
    - name: server-scan.fleet.rules
      interval: 30s
      rules:
        - record: server_scan:servers:max
          expr: max by (namespace, source_provider) (server_scan_servers)
        - record: server_scan:servers_stale:max
          expr: max by (namespace, source_provider) (server_scan_servers_stale)
        - record: server_scan:servers_unreachable:max
          expr: max by (namespace, source_provider) (server_scan_servers_unreachable)
        - record: server_scan:servers_partial:max
          expr: max by (namespace, source_provider) (server_scan_servers_partial)
        - record: server_scan:policy_active:max
          expr: max by (namespace, policy_key) (server_scan_policy_active)
        - record: server_scan:collector_last_run_duration_seconds:max
          expr: max by (namespace, source_provider) (server_scan_collector_last_run_duration_seconds)
        - record: server_scan:collector_last_run_servers_fetched:max
          expr: max by (namespace, source_provider) (server_scan_collector_last_run_servers_fetched)
        - record: server_scan:collector_last_run_ingest_errors:max
          expr: max by (namespace, source_provider) (server_scan_collector_last_run_ingest_errors)
        - record: server_scan:collector_last_run_collection_errors:max
          expr: max by (namespace, source_provider) (server_scan_collector_last_run_collection_errors)
        - record: server_scan:collector_last_run_partial:max
          expr: max by (namespace, source_provider) (server_scan_collector_last_run_partial)
        - record: server_scan:collector_last_run_age_seconds
          expr: time() - max by (namespace, source_provider) (server_scan_collector_last_run_timestamp_seconds)
        - record: server_scan:collector_last_seen_timestamp_seconds:max
          expr: max by (namespace, source_provider) (server_scan_collector_last_seen_timestamp_seconds)
        - record: server_scan:cluster_servers_held:max
          expr: max by (namespace, cluster) (server_scan_cluster_servers_held)
        - record: server_scan:cluster_last_reported_timestamp_seconds:max
          expr: max by (namespace, cluster) (server_scan_cluster_last_reported_timestamp_seconds)
        - record: server_scan:servers_by_health:max
          expr: max by (namespace, severity) (server_scan_servers_by_health)
        - record: server_scan:servers_in_maintenance:max
          expr: max by (namespace) (server_scan_servers_in_maintenance)
        - record: server_scan:duplicate_name_groups:max
          expr: max by (namespace) (server_scan_duplicate_name_groups)
        - record: server_scan:duplicate_name_servers:max
          expr: max by (namespace) (server_scan_duplicate_name_servers)
        - record: server_scan:membership_last_run_timestamp_seconds:max
          expr: max by (namespace, kind, reported_by) (server_scan_membership_last_run_timestamp_seconds)
        - record: server_scan:membership_last_run_duration_seconds:max
          expr: max by (namespace, kind, reported_by) (server_scan_membership_last_run_duration_seconds)
        - record: server_scan:membership_last_run_observed:max
          expr: max by (namespace, kind, reported_by) (server_scan_membership_last_run_observed)
        - record: server_scan:membership_last_run_matched:max
          expr: max by (namespace, kind, reported_by) (server_scan_membership_last_run_matched)
        - record: server_scan:membership_last_run_unmatched:max
          expr: max by (namespace, kind, reported_by) (server_scan_membership_last_run_unmatched)
        - record: server_scan:membership_last_run_partial:max
          expr: max by (namespace, kind, reported_by) (server_scan_membership_last_run_partial)
        # Age in seconds, so a dashboard needs no arithmetic.
        - record: server_scan:collector_silent_seconds
          expr: time() - max by (namespace, source_provider) (server_scan_collector_last_seen_timestamp_seconds)
        - record: server_scan:cluster_silent_seconds
          expr: time() - max by (namespace, cluster) (server_scan_cluster_last_reported_timestamp_seconds)
        - record: server_scan:membership_run_silent_seconds
          expr: time() - max by (namespace, kind, reported_by) (server_scan_membership_last_run_timestamp_seconds)

    - name: server-scan.fleet
      rules:
        - alert: ServerScanCollectorSilent
          expr: server_scan:collector_silent_seconds > {{ $silent }}
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Collector {{ "{{ $labels.source_provider }}" }} has not read any server for over {{ $silent }}s"
            description: "Its CronJob is failing, suspended, or never ran. Check `oc get jobs -n {{ .Release.Namespace }}` and the newest pod's logs."
        - alert: ServerScanServersStale
          expr: server_scan:servers_stale:max > {{ $stale }}
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "{{ "{{ $value }}" }} {{ "{{ $labels.source_provider }}" }} servers not collected within INVENTORY_STALE_AFTER_SECONDS"
            description: "The collector is running but these servers are not being read — dead BMCs, rejected logins, or hosts dropped from the manager. `server_scan:servers_unreachable:max` says how many are the first kind."
        - alert: ServerScanClusterSilent
          expr: server_scan:cluster_silent_seconds > {{ $membershipSilent }}
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Cluster {{ "{{ $labels.cluster }}" }}'s membership job has not reported for over {{ $membershipSilent }}s"
            description: "Its servers stay INSTALLED forever and nothing else notices. Check the nodes-status release in that cluster."
        - alert: ServerScanCollectorRunPartial
          expr: server_scan:collector_last_run_partial:max == 1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Collector {{ "{{ $labels.source_provider }}" }}'s last run did not see the whole fleet"
            description: "The run exited PARTIAL: TLS failures, per-host budgets exceeded, or ingest errors — not merely dead BMCs. `server_scan:collector_last_run_collection_errors:max` and `:ingest_errors:max` say how many; the newest pod's log says which."
        - alert: ServerScanFleetSnapshotFailing
          expr: sum by (namespace) (increase(server_scan_fleet_snapshot_failures_total[15m])) > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "The API cannot compute its fleet gauges"
            description: "Every server_scan_* gauge is frozen at its last good value. Almost always MongoDB — check mongo_ping_failures_total."
        - alert: ServerScanMembershipRunSilent
          expr: server_scan:membership_run_silent_seconds > {{ $membershipSilent }}
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "The {{ "{{ $labels.kind }}" }} membership job for {{ "{{ $labels.reported_by }}" }} has not completed a run for over {{ $membershipSilent }}s"
            description: "Its CronJob is failing, suspended, or never ran — and it has never reported a single matched hostname either, or ServerScanClusterSilent would already have fired. Check `oc get jobs -n {{ .Release.Namespace }}` and the newest pod's logs."
        - alert: ServerScanMembershipUnmatched
          expr: server_scan:membership_last_run_unmatched:max > {{ $membershipUnmatched }}
          for: 60m
          labels:
            severity: warning
          annotations:
            summary: "{{ "{{ $value }}" }} hostname(s) the {{ "{{ $labels.kind }}" }} job for {{ "{{ $labels.reported_by }}" }} reports have no matching server"
            description: "The job itself is running fine (see ServerScanMembershipRunSilent for that), but it is reporting hosts the vendor collectors have never ingested — a naming mismatch, a not-yet-collected server, or a host that should be in INVENTORY_OPENSHIFT_EXCLUDE_NAME_PARTS. The newest pod's log lists the hostnames."
{{- end }}
