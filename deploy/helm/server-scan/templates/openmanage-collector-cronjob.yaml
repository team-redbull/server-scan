{{- if .Values.collectors.ome.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-collector-openmanage
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}-collector-openmanage
    app.kubernetes.io/component: collector
    app.kubernetes.io/part-of: server-scan
spec:
  schedule: {{ .Values.collectors.ome.schedule | quote }}
  {{- with .Values.collectors.timeZone }}
  timeZone: {{ . | quote }}
  {{- end }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      {{- if .Values.collectors.jobTtlSeconds }}
      ttlSecondsAfterFinished: {{ .Values.collectors.jobTtlSeconds }}
      {{- end }}
      backoffLimit: {{ .Values.collectors.ome.backoffLimit }}
      activeDeadlineSeconds: {{ .Values.collectors.ome.activeDeadlineSeconds }}
      template:
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          containers:
            - name: collector
              image: {{ include "serverScan.apiImage" . | quote }}
              imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
              command: ["python3", "-m", "tools.run_collector", "--manager-type", "OPENMANAGE"]
              env:
                - name: INVENTORY_ENVIRONMENT
                  value: production
                - name: INVENTORY_COLLECTOR_NAME_PATTERN
                  value: {{ .Values.collectors.namePattern | quote }}
                {{- if hasKey .Values.collectors.ome "namePattern" }}
                - name: INVENTORY_OME_NAME_PATTERN
                  value: {{ .Values.collectors.ome.namePattern | quote }}
                {{- end }}
                - name: INVENTORY_REDFISH_FLEET_CONCURRENCY
                  value: {{ .Values.collectors.ome.bmcConcurrency | quote }}
                - name: INVENTORY_OME_BMC_VERIFY_TLS
                  value: {{ .Values.collectors.ome.bmcVerifyTls | quote }}
                - name: INVENTORY_OME_BMC_PORT
                  value: {{ .Values.collectors.ome.bmcPort | quote }}
                # Shared with redfishStandalone, like caBundle above — the
                # same iDRAC-facing Redfish pass, not a second set of knobs.
                - name: INVENTORY_REDFISH_PCIE_GPU_DETECTION
                  value: {{ .Values.collectors.redfishStandalone.pcieGpuDetection | quote }}
                - name: INVENTORY_REDFISH_PCIE_GPU_MAX_DEVICES
                  value: {{ .Values.collectors.redfishStandalone.pcieGpuMaxDevices | quote }}
                - name: INVENTORY_REDFISH_PCIE_GPU_MAX_GPUS
                  value: {{ .Values.collectors.redfishStandalone.pcieGpuMaxGpus | quote }}
                - name: INVENTORY_REDFISH_PCIE_GPU_MODELS
                  value: {{ .Values.collectors.redfishStandalone.pcieGpuModels | quote }}
                {{- include "serverScan.dbEnv" . | nindent 16 }}
              envFrom:
                - configMapRef:
                    name: {{ .Release.Name }}-api-config
                - secretRef:
                    name: {{ .Values.collectors.existingSecret | default (printf "%s-collector-credentials" .Release.Name) }}
                # AD login (docs/adr/0034). Blank when auth.enabled is false
                # (this chart's own default), which the backend reads as no
                # different from the variable being unset, so mounting it
                # unconditionally is safe — matches backend-deployment.yaml.
                - secretRef:
                    name: {{ (.Values.auth | default dict).existingSecret | default (printf "%s-auth-credentials" .Release.Name) }}
              resources:
                {{- toYaml .Values.collectors.ome.resources | nindent 16 }}
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                seccompProfile:
                  type: RuntimeDefault
{{- end }}
