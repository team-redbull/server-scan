{{- if .Values.collectors.fake.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-collector-fake
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}-collector-fake
    app.kubernetes.io/component: collector
    app.kubernetes.io/part-of: server-scan
spec:
  schedule: {{ .Values.collectors.fake.schedule | quote }}
  {{- with .Values.collectors.timeZone }}
  timeZone: {{ . | quote }}
  {{- end }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      {{- if .Values.collectors.jobTtlSeconds }}
      ttlSecondsAfterFinished: {{ .Values.collectors.jobTtlSeconds }}
      {{- end }}
      backoffLimit: {{ .Values.collectors.fake.backoffLimit }}
      activeDeadlineSeconds: {{ .Values.collectors.fake.activeDeadlineSeconds }}
      template:
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          containers:
            - name: collector
              image: {{ include "serverScan.apiImage" . | quote }}
              imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
              command:
                - python3
                - -m
                - tools.seed_inventory
                - --count
                - {{ .Values.collectors.fake.count | quote }}
                - --seed
                - {{ .Values.collectors.fake.seed | quote }}
              env:
                - name: INVENTORY_ENVIRONMENT
                  value: production
                {{- include "serverScan.dbEnv" . | nindent 16 }}
              envFrom:
                - configMapRef:
                    name: {{ .Release.Name }}-api-config
                # AD login (docs/adr/0034). Blank when auth.enabled is false
                # (this chart's own default), which the backend reads as no
                # different from the variable being unset, so mounting it
                # unconditionally is safe — matches backend-deployment.yaml.
                - secretRef:
                    name: {{ (.Values.auth | default dict).existingSecret | default (printf "%s-auth-credentials" .Release.Name) }}
              resources:
                {{- toYaml .Values.collectors.fake.resources | nindent 16 }}
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                seccompProfile:
                  type: RuntimeDefault
{{- end }}
