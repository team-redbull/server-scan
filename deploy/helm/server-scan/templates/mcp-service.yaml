{{- $mcp := .Values.mcp | default dict }}
{{- if $mcp.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-mcp
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}-mcp
    app.kubernetes.io/component: mcp
    app.kubernetes.io/part-of: server-scan
spec:
  selector:
    app.kubernetes.io/name: {{ .Release.Name }}-mcp
  ports:
    - name: http
      port: 80
      targetPort: http
{{- end }}
