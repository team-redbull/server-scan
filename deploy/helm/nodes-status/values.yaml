# One release per cluster. A UPI cluster enables `nodes`; an MCE hub
# enables both — `agents` for the fleet it manages, `nodes` for its own
# hardware, which is a cluster like any other and would otherwise never
# be reported as in use.

image:
  repository: ghcr.io/team-redbull/server-scan-api
  # Blank means the chart's appVersion. Never `latest`.
  tag: ""
  pullPolicy: IfNotPresent

# Where the inventory lives. These jobs write to MongoDB directly, like
# every collector — they never call the platform's API — so each cluster
# needs network to it and a copy of these Secrets.
#
# Set mongoUri / cursorSecret below and this chart renders both Secrets
# itself (db-secret.yaml) — nothing to create by hand. Leave them blank
# and it falls back to consuming Secrets named secretName/cursorSecretName
# that already exist in the namespace (provisioned by a secrets operator,
# or `oc create secret`), same as before.
db:
  secretName: server-scan-db
  mongoUriKey: mongo-uri
  cursorSecretName: server-scan-cursor
  cursorSecretKey: cursor-secret
  # Plaintext in this values file. Accepted here because these values live
  # in a private, air-gapped repo — the operator's own call, not this
  # chart's default recommendation. A secrets operator (Vault, External
  # Secrets, sealed-secrets) is still the better answer once one exists for
  # this environment; leaving these blank and pre-creating the Secrets
  # above is how to use one.
  mongoUri: ""
  cursorSecret: ""
  # The database mongoUri's connection is used against — read explicitly
  # by name, never taken from the URI's own path segment. Must be the
  # same value as the server-scan chart's db.dbName, since both write into
  # the same database.
  dbName: server-scan

serviceAccount:
  name: nodes-status

nodes:
  enabled: true
  # Required when enabled. Written onto every server this job claims, and
  # the scope it is allowed to release: a job frees only servers already
  # naming its own cluster, never another's. Templating fails without it
  # rather than deploying a job that exits 2 every 15 minutes.
  clusterName: ""
  # Applied *after* the `node-role.kubernetes.io/worker` label selector,
  # not instead of it: infra nodes usually carry the worker label too, so
  # the label alone keeps them, while a name list alone would misfire on
  # a node called `compute-infra-01`. Add per cluster rather than editing
  # the code.
  excludeNameParts: infra,control-plane
  schedule: "*/15 * * * *"
  backoffLimit: 1
  # Well under the schedule, so a hung run is killed before the next is
  # due rather than blocking it under Forbid.
  activeDeadlineSeconds: 600
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

agents:
  # Off by default: a cluster with no Agent CRD would run this every 15
  # minutes and fail every time, turning a real alert channel into noise.
  enabled: false
  # Required when enabled. Same role as nodes.clusterName.
  mceName: ""
  schedule: "*/15 * * * *"
  backoffLimit: 1
  activeDeadlineSeconds: 600
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

# Set on both CronJobs when non-empty; otherwise the cluster's own zone.
timeZone: ""

# Applied to both CronJobs' `jobTemplate.spec.ttlSecondsAfterFinished` (the
# TTL controller, GA since Kubernetes 1.23): a finished Job (and its Pod)
# is deleted this many seconds after it completes, success or failure,
# independent of `successfulJobsHistoryLimit`/`failedJobsHistoryLimit`
# below — same mechanism as the server-scan chart's `collectors.
# jobTtlSeconds`, just a shorter default here because these jobs run every
# 15 minutes, not every few hours: 30 minutes is enough to check a run's
# logs before the next one lands, without ever piling up finished Jobs.
# Set to 0 to disable and rely on the count-based limits alone.
jobTtlSeconds: 1800
