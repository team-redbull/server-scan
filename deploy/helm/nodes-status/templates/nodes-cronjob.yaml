{{- if .Values.nodes.enabled }}
{{- $_ := required "nodes.clusterName is required when nodes.enabled: it is written onto every server this job claims and scopes what it may release." .Values.nodes.clusterName }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-openshift-nodes
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}-openshift-nodes
    app.kubernetes.io/component: membership
    app.kubernetes.io/part-of: server-scan
spec:
  schedule: {{ .Values.nodes.schedule | quote }}
  {{- with .Values.timeZone }}
  timeZone: {{ . | quote }}
  {{- end }}
  # Forbid, not Replace: two overlapping reconciles would race on the same
  # servers, and the loser's release would undo the winner's claim.
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      {{- if .Values.jobTtlSeconds }}
      ttlSecondsAfterFinished: {{ .Values.jobTtlSeconds }}
      {{- end }}
      backoffLimit: {{ .Values.nodes.backoffLimit }}
      activeDeadlineSeconds: {{ .Values.nodes.activeDeadlineSeconds }}
      template:
        spec:
          restartPolicy: Never
          serviceAccountName: {{ .Values.serviceAccount.name }}
          # The one workload in this platform that needs its token: it
          # reads its own cluster's API. Every collector CronJob in the
          # server-scan chart sets this false.
          automountServiceAccountToken: true
          containers:
            - name: membership
              image: {{ include "nodesStatus.image" . | quote }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command: ["python3", "-m", "tools.collect_openshift", "--source", "nodes"]
              env:
                - name: INVENTORY_ENVIRONMENT
                  value: production
                - name: INVENTORY_OPENSHIFT_CLUSTER_NAME
                  value: {{ .Values.nodes.clusterName | quote }}
                - name: INVENTORY_OPENSHIFT_EXCLUDE_NAME_PARTS
                  value: {{ .Values.nodes.excludeNameParts | quote }}
                {{- if .Values.nodes.ssh.enabled }}
                - name: INVENTORY_OPENSHIFT_SSH_KEY_FILE
                  value: /etc/nodes-ssh/{{ .Values.nodes.ssh.secretKey }}
                - name: INVENTORY_OPENSHIFT_SSH_USER
                  value: {{ .Values.nodes.ssh.user | quote }}
                - name: INVENTORY_OPENSHIFT_SSH_CONNECT_TIMEOUT_SECONDS
                  value: {{ .Values.nodes.ssh.connectTimeoutSeconds | quote }}
                - name: INVENTORY_OPENSHIFT_SSH_CONCURRENCY
                  value: {{ .Values.nodes.ssh.concurrency | quote }}
                {{- end }}
                {{- include "nodesStatus.dbEnv" . | nindent 16 }}
              {{- if .Values.nodes.ssh.enabled }}
              volumeMounts:
                - name: nodes-ssh
                  mountPath: /etc/nodes-ssh
                  readOnly: true
              {{- end }}
              resources:
                {{- toYaml .Values.nodes.resources | nindent 16 }}
              securityContext:
                {{- include "nodesStatus.securityContext" . | nindent 16 }}
          {{- if .Values.nodes.ssh.enabled }}
          volumes:
            - name: nodes-ssh
              secret:
                # An externally provisioned Secret always wins; the
                # chart's own ssh.privateKey is the opt-in fallback. See
                # ssh-secret.yaml.
                secretName: {{ .Values.nodes.ssh.existingSecret | default (printf "%s-nodes-ssh" .Release.Name) }}
                defaultMode: 0400
          {{- end }}
{{- end }}
