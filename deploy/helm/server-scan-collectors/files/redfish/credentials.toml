# THE CHART'S OWN COPY of the standalone Redfish per-host logins.
#
# ############################ READ THIS ############################
# THIS FILE IS COMMITTED TO GIT. Anything you type below is a password
# in your repository's history, readable by everyone with clone access
# and unremovable by a later edit.
#
# It ships with PLACEHOLDER values and is NOT rendered by default:
# `collectors.redfishStandalone.credentialsFile` is empty, and the chart
# creates no Secret from this file until you point that value here.
#
# The production path is `collectors.redfishStandalone.credentialsSecret`
# — a Secret provisioned by Vault, External Secrets or sealed-secrets,
# which this chart then only mounts. It wins over this file when both are
# set. Use this file for a lab, a demo, or an estate whose BMC logins are
# genuinely not secret.
# ###################################################################
#
# Standalone Redfish collector — named BMC logins.
#
# Mounted read-only from a Kubernetes SECRET (not a ConfigMap) at the path
# named by INVENTORY_REDFISH_CREDENTIALS_FILE, with defaultMode 0400.
#
# A file rather than environment variables for two reasons: an estate
# where every BMC has its own account cannot be expressed as flat
# settings fields, and the whole environment of a process is readable via
# /proc/<pid>/environ and printed by `kubectl describe`.
#
# Every value here is the literal CHANGE-ME on purpose. A plausible-looking
# example ("admin"/"calvin"/"password") is the one that gets shipped to
# production by accident.
#
# THIS FILE IS AN EXAMPLE. The real one is gitignored — see .gitignore.
# A fleet that shares one account needs no such file at all: set
# INVENTORY_REDFISH_USERNAME and INVENTORY_REDFISH_PASSWORD instead.

# Named after the host it serves, which is what lets the inventory entry
# stay a bare address.
[credentials."192.0.2.41"]
username = "CHANGE-ME"
password = "CHANGE-ME"

[credentials."192.0.2.44"]
username = "CHANGE-ME"
password = "CHANGE-ME"

# Referenced explicitly by `credential = "..."` in the inventory.
[credentials.site-tlv-shared]
username = "CHANGE-ME"
password = "CHANGE-ME"

[credentials.legacy-box-43]
username = "CHANGE-ME"
password = "CHANGE-ME"
