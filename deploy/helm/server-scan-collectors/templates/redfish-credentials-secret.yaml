{{- $rf := (.Values.collectors | default dict).redfishStandalone | default dict }}
{{- /*
Per-host BMC logins from a file in the chart — opt-in, and off by default.

Rendered only when `credentialsFile` is set AND `credentialsSecret` is
not: an externally provisioned Secret (Vault, External Secrets, sealed-
secrets) is the production path and always wins. Setting `credentialsFile`
means the passwords live in git; files/redfish/credentials.toml says so in
its own header.
*/}}
{{- if and $rf.enabled $rf.credentialsFile (not $rf.credentialsSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-redfish-credentials" .Release.Name }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}-redfish-credentials
    app.kubernetes.io/component: collector
    app.kubernetes.io/part-of: server-scan
type: Opaque
stringData:
  credentials.toml: |
{{ required (printf "collectors.redfishStandalone.credentialsFile points at %q, which is not in the chart." $rf.credentialsFile) (.Files.Get $rf.credentialsFile) | indent 4 }}
{{- end }}
