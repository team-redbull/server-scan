{{- /* Rendered only when the value is set: blank means consume a Secret that already exists (the hub shape, owned by the server-scan release). */ -}}
{{- $db := .Values.db | default dict }}
{{- if $db.mongoUri }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $db.secretName | default "server-scan-db" }}
  labels:
    app.kubernetes.io/name: {{ $db.secretName | default "server-scan-db" }}
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: server-scan
type: Opaque
stringData:
  {{ $db.mongoUriKey | default "mongo-uri" }}: {{ $db.mongoUri | quote }}
{{- end }}
---
{{- if $db.cursorSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $db.cursorSecretName | default "server-scan-cursor-secret" }}
  labels:
    app.kubernetes.io/name: {{ $db.cursorSecretName | default "server-scan-cursor-secret" }}
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: server-scan
type: Opaque
stringData:
  {{ $db.cursorSecretKey | default "cursor-secret" }}: {{ $db.cursorSecret | quote }}
{{- end }}
