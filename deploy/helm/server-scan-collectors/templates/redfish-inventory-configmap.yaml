{{- $rf := (.Values.collectors | default dict).redfishStandalone | default dict }}
{{- /*
The fleet list, from whichever of three sources is set. Skipped entirely
when the collector is off or `inventoryConfigMap` names one this chart does not own.

`.Files.Get` is the default source, so the fleet is an actual .toml file
in the chart (files/redfish/inventory.toml) that a reviewer can read and a
GitOps diff can show line by line — rather than a YAML string. It holds no
passwords, which is why this is a ConfigMap; see the file's own header.
*/}}
{{- $content := "" }}
{{- if not $rf.enabled }}
{{- else if $rf.inventoryToml }}
{{- $content = $rf.inventoryToml }}
{{- else if $rf.inventoryFile }}
{{- $content = required (printf "collectors.redfishStandalone.inventoryFile points at %q, which is not in the chart." $rf.inventoryFile) (.Files.Get $rf.inventoryFile) }}
{{- end }}
{{- if and $content (not $rf.inventoryConfigMap) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "%s-redfish-inventory" .Release.Name }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}-redfish-inventory
    app.kubernetes.io/component: collector
    app.kubernetes.io/part-of: server-scan
data:
  inventory.toml: |
{{ $content | indent 4 }}
{{- end }}
