{{- $w := .Values.warranty | default dict }}
{{- if and $w.mongoUri (not $w.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "collectors.warrantySecretName" . }}
  labels:
    app.kubernetes.io/name: {{ include "collectors.warrantySecretName" . }}
    app.kubernetes.io/component: collector
    app.kubernetes.io/part-of: server-scan
type: Opaque
stringData:
  mongo-uri: {{ $w.mongoUri | quote }}
{{- end }}
