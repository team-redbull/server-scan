name: CI

on:
  push:
    branches: ["**"]

# No `pull_request` trigger: GitHub matches a workflow run to a PR by
# commit SHA regardless of what triggered it, so a `push` run on the PR's
# head branch already shows up as its check — adding `pull_request` back
# would only produce a second, duplicate run for the same commit. The
# tradeoff: a PR opened from a fork lives on a branch this repo never
# sees a `push` for, so it would get no CI at all under this trigger.
# Re-add `pull_request: {branches: [main]}` if this repo ever takes
# contributions from forks.
#
# Supersede an in-flight run when its branch is pushed to again. Never
# cancel a main run — that one can be mid-publish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

# Every action is pinned to a full commit SHA, with the human-readable
# version in the trailing comment. A tag is a mutable pointer: whoever
# controls an action's repository can re-point `v7` at new code, and every
# workflow using `@v7` picks it up on the next run with no diff anywhere.
# That is not hypothetical — it is how tj-actions/changed-files was used
# in 2025 to dump CI secrets out of thousands of repositories. A SHA
# cannot be re-pointed.
#
# The cost is real and unmitigated: a pinned action never updates itself,
# so these SHAs need a periodic manual pass against each action's latest
# release, or they rot into "old and unpatched" — which is the opposite
# of what the pinning is for.
env:
  PYTHON_VERSION: "3.13"

jobs:
  lint:
    name: Lint (ruff + ty)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # enable-cache reuses the uv cache across runs, keyed on uv.lock.
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-groups --locked

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format --check
        run: uv run ruff format --check .

      # Matches the command CLAUDE.md documents — `tools/` is real
      # shipped code (the collector runner) and was previously unchecked.
      # `tests/` joined it after ADR-0023's Phase 1 follow-up: those files
      # sat outside every prior `ty check` invocation and carried mypy-style
      # `# type: ignore[...]` comments ty silently does not honor (only a
      # bare `# type: ignore` or its own `# ty: ignore[rule-name]` are), so
      # a batch of real mismatches went unseen until this line started
      # checking them.
      #
      # ty replaced mypy here (ADR-0019). It is a pinned dev dependency
      # installed by the `uv sync --all-groups` above, deliberately not a
      # GitHub Action: nothing to SHA-pin under ADR-0013, and the version
      # CI runs is the version `uv.lock` names, which is the version a
      # developer runs locally. Because it is beta on 0.0.x, a version bump
      # is expected to move diagnostics — read a new error after one as ty
      # changing, not as a regression in this codebase.
      - name: ty
        run: uv run ty check backend/app tools tests

      # Convention 8's two rules ruff cannot express: comment-block length
      # and docstring-summary length. Existing offenders are baselined and
      # that list may only shrink.
      - name: comment density
        run: uv run python scripts/check_comment_density.py

      # Gates the 4 layering contracts that already hold (domain
      # independent of every outer layer, infrastructure independent of
      # application and api, application independent of api) — see
      # `pyproject.toml`'s `[tool.importlinter]` for the 5th, broken one,
      # which is recorded as known debt rather than gated red.
      - name: import-linter
        run: uv run lint-imports

      # Not a dev dependency, deliberately: `pip-audit` itself is never
      # part of the image, so `--with` installs it into a throwaway venv
      # for this one step rather than adding a permanent line to
      # `pyproject.toml`'s dev group. This is precisely the check that was
      # missing when `cryptography`'s CVEs went unnoticed after ADR-0013
      # removed Dependabot — see CLAUDE.md's "Keeping CI current".
      - name: pip-audit
        run: uv run --with pip-audit pip-audit --skip-editable

      # Same ephemeral-install reasoning as pip-audit above: a dependency
      # auditor has no reason to ship in the image. Caught `starlette`
      # imported directly in three files while resolving only as
      # fastapi's transitive dependency — a fastapi bump could change
      # that version with nothing here to notice.
      - name: deptry
        run: uv run --with deptry==0.24.0 deptry . --known-first-party app

  helm:
    name: Helm lint (every chart)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The runner's own preinstalled helm, deliberately not
      # `azure/setup-helm`: ADR-0013 requires every action be SHA-pinned
      # and then manually re-pinned forever, and a linter is not worth
      # that standing cost when ubuntu-latest already ships the binary.
      # The trade is a version that floats with the runner image, so the
      # version is printed — a lint that starts failing on a day nobody
      # touched this repo is answered by this line.
      - name: helm version
        run: helm version

      # Every chart under deploy/helm, discovered rather than listed, so a
      # chart added later is linted without anyone remembering to edit this
      # file. Failing on an empty glob is deliberate: a silently-skipped
      # lint job is worse than no lint job.
      #
      # `lint` only here. `helm template` is the step below, per chart with
      # real values, because `nodes-status` deliberately cannot render from
      # its defaults — `nodes.clusterName` is `required`, which is the
      # point of that value.
      - name: helm lint
        run: |
          set -euo pipefail
          shopt -s nullglob
          charts=(deploy/helm/*/Chart.yaml)
          if [ ${#charts[@]} -eq 0 ]; then
            echo "No charts found under deploy/helm — did the layout change?" >&2
            exit 1
          fi
          for chart in "${charts[@]}"; do
            dir="$(dirname "$chart")"
            echo "::group::helm lint $dir"
            helm lint "$dir"
            echo "::endgroup::"
          done

      # What `lint` cannot catch: a template that renders invalid YAML, or
      # one whose `required` trips only under a value combination the
      # defaults never reach. Everything interesting here is off by
      # default — the frontend, every collector CronJob, both membership
      # jobs — so defaults alone exercise almost none of the templates.
      - name: helm template
        run: |
          set -euo pipefail
          helm template ci-lint deploy/helm/server-scan > /dev/null
          helm template ci-lint deploy/helm/server-scan \
            --set frontend.enabled=true \
            --set route.host=scan.apps.example.com \
            --set metrics.serviceMonitor.enabled=true \
            --set metrics.prometheusRule.enabled=true \
            --set metrics.userWorkloadMonitoring.enabled=true > /dev/null
          helm template ci-lint deploy/helm/server-scan \
            --set collectors.redfishStandalone.enabled=true \
            --set collectors.redfishStandalone.credentialsFile=files/redfish/credentials.toml \
            --set collectors.ucsCentral.enabled=true \
            --set collectors.intersight.enabled=true \
            --set collectors.openmanage.enabled=true \
            --set collectors.oneview.enabled=true \
            --set collectors.fake.enabled=true > /dev/null
          helm template ci-lint deploy/helm/nodes-status \
            --set nodes.clusterName=ci-cluster > /dev/null
          helm template ci-lint deploy/helm/nodes-status \
            --set nodes.clusterName=ci-cluster \
            --set agents.enabled=true --set agents.mceName=ci-mce > /dev/null

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mongo:
        image: mongo:8
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\")'"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      INVENTORY_MONGO_URI: mongodb://localhost:27017
      INVENTORY_REDIS_URI: redis://localhost:6379/0
      INVENTORY_ENVIRONMENT: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-groups --locked

      - name: Run tests with coverage
        run: uv run pytest --cov=app --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-xml
          path: coverage.xml

  frontend:
    name: Frontend (lint + typecheck + test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: npm audit
        run: npm audit

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test -- --run

      - name: Build
        run: npm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mongo:
        image: mongo:8
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\")'"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      INVENTORY_MONGO_URI: mongodb://localhost:27017
      INVENTORY_REDIS_URI: redis://localhost:6379/0
      INVENTORY_ENVIRONMENT: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      - name: Install backend dependencies
        run: uv sync --all-groups --locked

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # Keyed on the resolved `@playwright/test` version (not just
      # package-lock.json's hash) so a bump reliably invalidates the
      # cache even if it lands with unrelated lockfile churn, and a
      # restore avoids re-downloading the chromium headless shell — the
      # slowest single step in this job — on every run.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-only-shell-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: frontend
        # No --with-deps: the runner image already has every browser lib,
        # so it only added CJK/Cyrillic fonts this Latin-only UI never
        # renders — 21 MB at 35 kB/s from a slow apt mirror, 10 of the
        # step's 10m30s. --only-shell skips the headed Chrome build; the
        # chromium project sets no channel and runs headless.
        run: npx playwright install chromium --only-shell

      - name: Start backend
        run: |
          uv run uvicorn app.main:app --host 0.0.0.0 --port 8080 \
            > "$RUNNER_TEMP/backend.log" 2>&1 &
          for _ in $(seq 1 30); do
            curl -sf http://localhost:8080/health/ready && exit 0
            sleep 1
          done
          echo "backend did not become ready in time"
          cat "$RUNNER_TEMP/backend.log"
          exit 1

      # Small on purpose — E2E flow coverage, not the 10k/50k scale
      # verification tools/loadtest.py owns (docs/adr/0007).
      - name: Seed a deterministic dataset
        run: uv run python -m tools.seed_inventory --count 300 --seed 42

      - name: Start frontend dev server
        working-directory: frontend
        run: |
          npm run dev -- --port 5173 --host > "$RUNNER_TEMP/frontend.log" 2>&1 &
          for _ in $(seq 1 30); do
            curl -sf http://localhost:5173/ > /dev/null && exit 0
            sleep 1
          done
          echo "frontend dev server did not become ready in time"
          cat "$RUNNER_TEMP/frontend.log"
          exit 1

      - name: Run Playwright tests
        working-directory: frontend
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

  publish:
    name: Publish images (GHCR)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Never against untested or not-yet-merged code. `push` is this
    # workflow's only trigger, so `github.ref` alone decides the branch —
    # an `event_name` check here would never actually differ.
    needs: [lint, helm, test, frontend, e2e]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write # the "Tag the release" step below pushes the new git tag
      packages: write # docker/login-action pushes images to ghcr.io
    outputs:
      version: ${{ steps.version.outputs.version }} # "1.2.0", no v — what `deploy` pins
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history — the tag action scans every commit since the last tag

      # `feat!:`/`BREAKING CHANGE:` -> major, `feat:` -> minor, anything
      # else -> patch, read from the commits since the last `v*` tag.
      #
      # Replaced mathieudutour/github-tag-action, which did the same job
      # but declares `using: node20`. Node 20 reached end of life in April
      # 2026, GitHub's runners have force-run such actions on Node 24
      # since June 2026, and that fallback is removed in autumn 2026 — at
      # which point the action stops running and this job publishes
      # nothing. There was no version to upgrade to: its last release was
      # March 2024 and its default branch still declares node20.
      #
      # This one runs on node24 and its default patterns are already
      # Conventional Commits (`/!:|BREAKING CHANGE:/`, `/feat(\(.+\))?:/`),
      # so the versioning rule is unchanged. The one thing it does not do
      # is push the tag, hence the two steps below.
      - name: Determine next version from Conventional Commits
        id: version
        uses: PaulHatch/semantic-version@9f72830310d5ed81233b641ee59253644cd8a8fc # v6.0.2
        with:
          tag_prefix: "v"

      # A wrong version is worse than a failed build: it would publish
      # images under a tag that already exists or that moves backwards,
      # and neither is recoverable by re-running. Fail loudly instead.
      # The one exception is the tag already sitting on this very commit:
      # that is a re-run after a later step failed (a GitHub API outage
      # once left a tag with no release and no images), and every step
      # below is idempotent for it.
      - name: Verify the computed version moves forward
        env:
          NEW_TAG: ${{ steps.version.outputs.version_tag }}
        run: |
          set -euo pipefail
          previous="$(git tag --list 'v*' --sort=-v:refname | head -1)"
          echo "previous tag: ${previous:-<none>}  ->  computed: $NEW_TAG"
          if [ -z "$NEW_TAG" ]; then
            echo "::error::version step produced an empty tag"; exit 1
          fi
          if existing="$(git rev-parse -q --verify "refs/tags/$NEW_TAG^{commit}")"; then
            if [ "$existing" != "$(git rev-parse HEAD)" ]; then
              echo "::error::$NEW_TAG already exists on ${existing:0:7} — refusing to re-tag"; exit 1
            fi
            echo "$NEW_TAG already points at this commit — re-run, keeping it"
          fi
          if [ -n "$previous" ] && [ "$(printf '%s\n%s\n' "$previous" "$NEW_TAG" | sort -V | tail -1)" != "$NEW_TAG" ]; then
            echo "::error::$NEW_TAG is not newer than $previous"; exit 1
          fi

      - name: Tag the release
        env:
          NEW_TAG: ${{ steps.version.outputs.version_tag }}
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/$NEW_TAG" >/dev/null; then
            echo "$NEW_TAG already exists — re-run, not re-tagging"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$NEW_TAG" -m "$NEW_TAG"
          git push origin "$NEW_TAG"

      # What changed in a release is derived from the commits in it, not
      # from a file somebody has to remember to edit. A hand-maintained
      # CHANGELOG.md was tried and removed: releases here are unattended
      # (ADR-0010 tags and publishes on every push to main), so nobody is
      # present at the moment a version is cut, and its `## Unreleased`
      # heading was never renamed — entries sat under it for six releases,
      # telling operators to act on changes they already had.
      #
      # Conventional Commits already decide the version number; this reads
      # the same subjects to say what is in it. That means the release
      # notes can never drift from the release, and a good commit message
      # is now the only thing anyone has to write.
      - name: Publish the release notes
        env:
          NEW_TAG: ${{ steps.version.outputs.version_tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # The previous tag reachable from this commit, not the newest
          # tag overall: a tag left on a rebased-away commit must not be
          # treated as the start of this range.
          previous="$(git describe --tags --abbrev=0 "$NEW_TAG^" 2>/dev/null || true)"
          if [ -n "$previous" ]; then
            range="$previous..$NEW_TAG"
            echo "notes range: $range"
          else
            range="$NEW_TAG"
            echo "notes range: everything up to $NEW_TAG (no earlier tag)"
          fi
          git log --no-merges --format=%s "$range" > /tmp/subjects.txt
          # The subjects arrive as a file path, not on stdin: `python3 -`
          # already reads the program itself from stdin, so a second
          # redirect there silently feeds the script nothing.
          python3 - "$NEW_TAG" "$previous" /tmp/subjects.txt > /tmp/notes.md <<'PY'
          import pathlib, re, sys

          tag, previous, subjects = sys.argv[1], sys.argv[2], sys.argv[3]
          # Conventional Commits, same grammar the version step reads.
          pattern = re.compile(r"^(?P<type>[a-z]+)(?P<scope>\([^)]*\))?(?P<bang>!)?: (?P<rest>.+)$")
          groups: dict[str, list[str]] = {}
          other: list[str] = []
          headings = {
              "breaking": "Breaking",
              "feat": "New features",
              "fix": "Fixed",
              "perf": "Performance",
              "docs": "Documentation",
          }
          for line in (l.strip() for l in pathlib.Path(subjects).read_text().splitlines()):
              if not line:
                  continue
              m = pattern.match(line)
              if not m:
                  other.append(line)
                  continue
              # A `!` marks the change that forced the major bump, so it
              # leads regardless of its type.
              key = "breaking" if m["bang"] else m["type"]
              if key not in headings:
                  # refactor/test/chore/style/ci: real work, but nothing an
                  # operator can observe. Deliberately dropped.
                  continue
              groups.setdefault(key, []).append(m["rest"])

          out = []
          for key, heading in headings.items():
              if groups.get(key):
                  out.append(f"### {heading}\n")
                  out += [f"- {item}" for item in groups[key]]
                  out.append("")
          if other:
              out.append("### Other\n")
              out += [f"- {item}" for item in other]
              out.append("")
          if not out:
              out = ["No operator-visible changes in this release.", ""]
          if previous:
              out.append(f"**Full changelog:** {previous}...{tag}")
          print("\n".join(out))
          PY
          cat /tmp/notes.md
          # Skip on a re-run, and ride out a transient API error: the
          # release is the only step here that is not retried by anything.
          for attempt in 1 2 3; do
            if gh release view "$NEW_TAG" >/dev/null 2>&1; then
              echo "release $NEW_TAG already exists"; break
            fi
            gh release create "$NEW_TAG" --title "$NEW_TAG" --notes-file /tmp/notes.md && break
            if [ "$attempt" = 3 ]; then
              echo "::error::could not create release $NEW_TAG after 3 attempts"; exit 1
            fi
            echo "release create failed (attempt $attempt), retrying in 30s"; sleep 30
          done

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # Both images get: full semver, rolling major.minor and major,
      # `latest`, and the commit sha.
      - name: API image metadata
        id: meta_api
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          # docker/metadata-action lowercases `images` itself, which is
          # what GHCR requires — no separate normalisation step needed.
          images: ghcr.io/${{ github.repository }}-api
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.version_tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.version_tag }}
            type=semver,pattern={{major}},value=${{ steps.version.outputs.version_tag }}
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build & push API image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64 # the image's own Python download is x86_64-only, see Containerfile
          push: true
          tags: ${{ steps.meta_api.outputs.tags }}
          labels: ${{ steps.meta_api.outputs.labels }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Frontend image metadata
        id: meta_frontend
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}-frontend
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.version_tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.version_tag }}
            type=semver,pattern={{major}},value=${{ steps.version.outputs.version_tag }}
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build & push frontend image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./frontend
          file: frontend/Containerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta_frontend.outputs.tags }}
          labels: ${{ steps.meta_frontend.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # A release is not deployed until redbull-platform says so — ADR-0031.
  # This pins that repo's copy of the chart to the version `publish` just
  # released and syncs the chart's templates and files verbatim; Argo CD
  # does the rest. The gitops values.yaml is the cluster's override file
  # and is edited by key only, never replaced.
  deploy:
    name: Deploy (bump redbull-platform)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [publish]
    if: github.ref == 'refs/heads/main' && needs.publish.outputs.version != ''
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: src

      # The default GITHUB_TOKEN is scoped to this repo; writing to the
      # gitops repo needs the org secret every service's bump uses.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: team-redbull/redbull-platform
          token: ${{ secrets.REDBULL_WRITE_TOKEN }}
          path: gitops

      - name: Sync the chart copy and pin the images
        env:
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          set -euo pipefail
          chart=gitops/gitops/charts/server-scan
          rsync -a --delete src/deploy/helm/server-scan/templates/ "$chart/templates/"
          rsync -a --delete src/deploy/helm/server-scan/files/ "$chart/files/"
          # sed, not yq: `yq -i` re-emits the whole file, dropping every
          # blank line and reflowing maps — a 70-line noise diff per release
          # on a hand-maintained override file. The two `    tag:` lines are
          # the image tags (both images always carry the same version).
          sed -i -E "s/^(    tag: )\"[^\"]*\"$/\\1\"$VERSION\"/" "$chart/values.yaml"
          sed -i -E "s/^(appVersion: )\"[^\"]*\"$/\\1\"$VERSION\"/" "$chart/Chart.yaml"
          [ "$(grep -c "^    tag: \"$VERSION\"$" "$chart/values.yaml")" = 2 ] \
            || { echo "::error::expected exactly two image tag lines to pin"; exit 1; }
          grep -q "^appVersion: \"$VERSION\"$" "$chart/Chart.yaml" \
            || { echo "::error::appVersion was not pinned"; exit 1; }
          git -C gitops status --short

      # Offline only — a runner cannot reach the cluster, so this is helm
      # lint + template, not `oc apply --dry-run=server`. A `required`
      # value the gitops values.yaml does not set fails here, before Argo.
      - name: Render the chart the way Argo will
        run: |
          set -euo pipefail
          cd gitops/gitops/charts/server-scan
          helm lint .
          helm template server-scan . -n server-scan >/dev/null

      - name: Commit and push the bump
        env:
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          set -euo pipefail
          cd gitops
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gitops/charts/server-scan
          if git diff --cached --quiet; then echo "nothing to deploy"; exit 0; fi
          git commit -q -m "chore(server-scan): pin images to $VERSION" \
            -m "Released by team-redbull/server-scan@${GITHUB_SHA}; chart templates and files synced from deploy/helm/server-scan."
          # Every service bumps the same branch of this repo; rebase and retry.
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            echo "push rejected (attempt $attempt) — rebasing onto origin/main"
            git fetch origin main
            git rebase origin/main
            sleep $((RANDOM % 5 + 2))
          done
          echo "::error::could not push the bump after 5 attempts"; exit 1
