# Minimal SPA-serving nginx config. Only the parts that differ from the
# ubi9/nginx-124 image's own default are set here; the base image already
# handles the unprivileged listen port, user, and pid file location.

worker_processes auto;
error_log /var/log/nginx/error.log;
pid /run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;

  # The 481 KB bundle is 139 KB gzipped; the API gzips its own JSON.
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 6;
  gzip_types text/css application/javascript image/svg+xml application/json;

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # SPA routing: any path that isn't a static asset falls back to
    # index.html so client-side routing (react-router) can handle it.
    location / {
      try_files $uri $uri/ /index.html;
      # The entry point must revalidate on every load; the hashed assets
      # below are immutable, so a deploy is picked up on the next visit.
      add_header Cache-Control "no-cache";
    }

    # Where the chart mounts its API proxy (deploy/helm/server-scan's
    # frontend-api-proxy ConfigMap), so one Route serves the whole app.
    # A glob matching nothing is not an error, so the bare image still
    # runs standalone serving only static assets. Its own directory and
    # NOT /etc/nginx/conf.d: the base image may ship `server {}` blocks
    # there, which are invalid inside this `server` block and would stop
    # nginx from starting at all.
    include /etc/nginx/api-proxy.d/*.conf;

    location ~* \.(?:css|js|svg|woff2?)$ {
      add_header Cache-Control "public, max-age=31536000, immutable";
    }
  }
}
